global:
  scrape_interval: 20s
  scrape_timeout: 10s
  evaluation_interval: 20s

scrape_configs:
  - job_name: polymarket-bot
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - polymarket-bot:8097
  - job_name: market-data-ingester
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - market-data-ingester:8098
