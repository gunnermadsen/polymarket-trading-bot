              editorMode: code
              expr: >-
                sum by (strategy, error_code) (count_over_time({service_name="ingester",strategy="binance_spot_btcusdt_one_second_ohlcv",error_code="binance_ohlcv_gap_unrecoverable"}[5m])) >= 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - *reduce
          - *threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Binance 1-second OHLCV critical failure evidence'
          description: 'binance_spot_btcusdt_one_second_ohlcv emitted {{ printf "%.0f" $values.B.Value }} selected event(s) in five minutes. Error code: {{ $labels.error_code }}.'
          strategy: 'binance_spot_btcusdt_one_second_ohlcv'
