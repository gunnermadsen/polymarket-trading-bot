  - orgId: 1
    name: market-data-ingester-critical-20s
    folder: Market Data Ingestion
    interval: 20s
    rules:
      - uid: mdi_critical_1
        title: Binance aggregate trades critical failure
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              expr: >-
                sum by (strategy, error_code) (count_over_time({service_name="ingester",strategy="binance_spot_btcusdt_aggregate_trades",error_code=~"^(binance_aggregate_trade_id_jump|binance_aggregate_trade_gap_unrecoverable)$"}[5m])) >= 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - *reduce
          - *threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Binance aggregate trades critical failure evidence'
          description: 'binance_spot_btcusdt_aggregate_trades emitted {{ printf "%.0f" $values.B.Value }} selected event(s) in five minutes. Error code: {{ $labels.error_code }}.'
          strategy: 'binance_spot_btcusdt_aggregate_trades'
          failure_condition: 'binance_aggregate_trades_critical_failure'
          error_code: '{{ $labels.error_code }}'
          occurrence_count: '{{ printf "%.0f" $values.B.Value }}'
          evaluation_window: '5m'
        labels:
          strategy: binance_spot_btcusdt_aggregate_trades
          condition: strategy_critical_failure
          failure_condition: binance_aggregate_trades_critical_failure
          service: ingester
          family: market_data_ingestion
          environment: $GRAFANA_ALERT_ENVIRONMENT
          severity: critical
        dashboardUid: market-data-pipeline
        panelId: 25
        isPaused: false
      - uid: mdi_critical_2
        title: Binance 1-second OHLCV critical failure
        condition: C
        data:
          - refId: A
            queryType: instant
