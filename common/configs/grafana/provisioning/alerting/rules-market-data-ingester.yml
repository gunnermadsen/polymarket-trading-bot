apiVersion: 1

deleteRules:
  - orgId: 1
    uid: market_data_ingester_critical_error_log
  - orgId: 1
    uid: market_data_ingester_warning_storm

groups:
  - orgId: 1
    name: market-data-ingester-health-20s
    folder: Market Data Ingestion
    interval: 20s
    rules:
      - uid: mdi_health_1
        title: Binance aggregate trades health impaired
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: >-
                (max by (strategy) (market_data_ingester_strategy_state{strategy="binance_spot_btcusdt_aggregate_trades",desired_state="running",observed_state!="running"}) or max by (strategy) (market_data_ingester_strategy_state{strategy="binance_spot_btcusdt_aggregate_trades",desired_state="running",health_status!="healthy"}) or (0 * max by (strategy) (market_data_ingester_strategy_state{strategy="binance_spot_btcusdt_aggregate_trades"})) or absent(market_data_ingester_strategy_state{strategy="binance_spot_btcusdt_aggregate_trades"})) and on () (max(up{job="ingester-master"}) == 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - &reduce
            refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              type: reduce
              refId: B
          - &threshold
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              type: threshold
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Binance aggregate trades health is impaired'
          description: 'binance_spot_btcusdt_aggregate_trades is desired running but not running/healthy, or its profile series is missing while the ingester target is up. Value: {{ printf "%.0f" $values.B.Value }}.'
          strategy: 'binance_spot_btcusdt_aggregate_trades'
        labels:
          strategy: binance_spot_btcusdt_aggregate_trades
          condition: strategy_health_impaired
          service: ingester
          family: market_data_ingestion
          environment: $GRAFANA_ALERT_ENVIRONMENT
          severity: warning
        dashboardUid: market-data-pipeline
        panelId: 22
        isPaused: false
