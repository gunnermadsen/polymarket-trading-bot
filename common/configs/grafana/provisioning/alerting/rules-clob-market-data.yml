apiVersion: 1

groups:
  - orgId: 1
    name: clob-market-data-20s
    folder: Polymarket Trading Path
    interval: 20s
    rules:
      - uid: clob_remote_close_1013
        title: Trading hot-path CLOB remote close 1013 observed
        condition: C
        data:
          - refId: A
            datasourceUid: polymarket-bot-runtime
            relativeTimeRange:
              from: 60
              to: 0
            model:
              columns:
                - selector: shared_market_data.metrics.clob_last_remote_close_1013_age_milliseconds
                  text: CLOB Last Remote Close 1013 Age
                  type: number
              datasource:
                type: yesoreyeram-infinity-datasource
                uid: polymarket-bot-runtime
              format: table
              intervalMs: 1000
              json_options:
                root_is_not_array: true
              maxDataPoints: 43200
              parser: backend
              refId: A
              root_selector: ""
              source: url
              type: json
              url: http://polymarket-bot:8097/admin/strategy/btc-5m/readiness
              url_options:
                data: ""
                method: GET
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 300000
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          description: The polymarket-bot shared trading hot-path CLOB WebSocket received close code 1013 within the last five minutes. This alert does not observe the independent market-data-ingester connection.
          summary: Trading hot-path CLOB transport was asked to try again later
        labels:
          condition: remote_close_1013
          environment: $GRAFANA_ALERT_ENVIRONMENT
          family: clob_market_data
          service: polymarket-bot
          severity: warning
        isPaused: true
      - uid: clob_book_unavailable_sustained
        title: CLOB order book unavailable for trading
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: "(1 - min(polymarket_market_data_product_ready{product=\"polymarket_btc_five_minute_orderbooks\"})) or clamp_max(sum(polymarket_execution_freshness_expected), 1) or (0 * max(polymarket_execution_freshness_exporter_ready))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              type: threshold
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 90s
        annotations:
          summary: "CLOB order book unavailable for trading"
          description: "The canonical polymarket_btc_five_minute_orderbooks product is unready, or its readiness series is missing while a BTC process is active. This monitors product availability; execution-specific freshness is monitored separately."
        labels: {service: polymarket-bot, family: execution_freshness, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: clob_book_source_stale_for_execution
        title: Execution freshness repeatedly rejected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: "sum by (process_id, execution_mode) (increase(polymarket_execution_freshness_book_rejections_total[5m]) + increase(polymarket_execution_freshness_reference_rejections_total[5m])) or (0 * max(polymarket_execution_freshness_exporter_ready))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              type: threshold
              conditions: [{evaluator: {params: [9], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 60s
        annotations:
          summary: "Execution freshness repeatedly rejected"
          description: "At least ten stale or noncausal book/reference rejections occurred for this process in five minutes, sustained for one minute. These are prevented executions, not stale fills. Inspect source and receipt ages and the process configured limit."
        labels: {service: polymarket-bot, family: execution_freshness, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: binance_reference_unavailable
        title: Binance required reference feed unavailable for trading
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: "(1 - min(polymarket_market_data_product_ready{product=\"binance_spot_btcusdt_one_second_ohlcv\"})) or clamp_max(sum(polymarket_execution_freshness_expected), 1) or (0 * max(polymarket_execution_freshness_exporter_ready))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              type: threshold
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 90s
        annotations:
          summary: "Binance required reference feed unavailable for trading"
          description: "The canonical binance_spot_btcusdt_one_second_ohlcv product is unready, or its readiness series is missing while a BTC process is active. This monitors product availability; execution-specific freshness is monitored separately."
        labels: {service: polymarket-bot, family: execution_freshness, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false

  - orgId: 1
    name: live-order-integrity-20s
    folder: Polymarket Trading Path
    interval: 20s
    rules:
      - uid: live_order_reconciliation_degraded
        title: Live order reconciliation degraded
        condition: C
        data:
          - refId: A
            datasourceUid: postgres
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: grafana-postgresql-datasource
                uid: postgres
              editorMode: code
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                WITH active_live_processes AS MATERIALIZED (
                  SELECT process_id
                  FROM polymarket.trading_processes
                  WHERE enabled
                    AND status IN ('starting', 'running', 'stopping')
                    AND config #>> '{execution,mode}' = 'live'
                ), latest_reconciliation AS MATERIALIZED (
                  SELECT process.process_id,
                         reconciliation.status,
                         reconciliation.unresolved_count,
                         reconciliation.completed_at
                  FROM active_live_processes process
                  LEFT JOIN LATERAL (
                    SELECT status, unresolved_count, completed_at
                    FROM polymarket.live_reconciliation_runs
                    WHERE process_id = process.process_id
                    ORDER BY started_at DESC
                    LIMIT 1
                  ) reconciliation ON true
                )
                SELECT COUNT(*) FILTER (
                  WHERE status IS NULL
                     OR status <> 'completed'
                     OR unresolved_count > 0
                     OR completed_at IS NULL
                     OR completed_at < now() - interval '90 seconds'
                )::double precision AS value
                FROM latest_reconciliation;
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 60s
        annotations:
          description: At least one active live process has unresolved, failed, missing, or stale order reconciliation evidence.
          summary: Live order state cannot be reconciled cleanly
        labels:
          condition: live_order_reconciliation_degraded
          environment: $GRAFANA_ALERT_ENVIRONMENT
          family: order_integrity
          service: polymarket-bot
          severity: warning
        isPaused: false
