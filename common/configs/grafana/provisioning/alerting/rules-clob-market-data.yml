apiVersion: 1

groups:
  - orgId: 1
    name: clob-market-data-20s
    folder: Polymarket Trading Path
    interval: 20s
    rules:
      - uid: clob_remote_close_1013
        title: CLOB remote close 1013 observed
        condition: C
        data:
          - refId: A
            datasourceUid: polymarket-bot-runtime
            relativeTimeRange:
              from: 60
              to: 0
            model:
              columns:
                - selector: shared_market_data.metrics.clob_last_remote_close_1013_age_milliseconds
                  text: CLOB Last Remote Close 1013 Age
                  type: number
              datasource:
                type: yesoreyeram-infinity-datasource
                uid: polymarket-bot-runtime
              format: table
              intervalMs: 1000
              json_options:
                root_is_not_array: true
              maxDataPoints: 43200
              parser: backend
              refId: A
              root_selector: ""
              source: url
              type: json
              url: http://polymarket-bot:8097/admin/strategy/btc-5m/readiness
              url_options:
                data: ""
                method: GET
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 300000
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          description: The shared Polymarket CLOB WebSocket received close code 1013 within the last five minutes.
          summary: CLOB market-data transport was asked to try again later
        labels:
          condition: remote_close_1013
          environment: $GRAFANA_ALERT_ENVIRONMENT
          family: clob_market_data
          service: polymarket-bot
          severity: warning
        isPaused: false
