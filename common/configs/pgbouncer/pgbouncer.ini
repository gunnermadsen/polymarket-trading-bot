[databases]
polymarket = host=timescaledb-0 port=5432 dbname=polymarket

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
; Keep session pooling while SQLx queries use persistent(false). SQLx splits an unnamed
; Parse and Bind across protocol synchronization points, which transaction pooling may
; route to different PostgreSQL backends.
pool_mode = session
max_client_conn = 64
default_pool_size = 16
max_db_connections = 16
reserve_pool_size = 0
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
server_connect_timeout = 5
server_login_retry = 2
server_check_delay = 10
server_tls_sslmode = disable
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
