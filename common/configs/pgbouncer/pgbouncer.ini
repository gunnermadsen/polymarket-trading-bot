[databases]
; The legacy route remains available for a bounded rollback path.
polymarket = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=session pool_size=2 max_db_connections=2 max_db_client_connections=6
polymarket_trading = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=session pool_size=8 max_db_connections=8 max_db_client_connections=12
polymarket_ingester_master = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=session pool_size=2 max_db_connections=2 max_db_client_connections=4
polymarket_ingester_worker = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=session pool_size=16 max_db_connections=16 max_db_client_connections=96
polymarket_observe = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=session pool_size=2 max_db_connections=2 max_db_client_connections=6
; Transaction-pooled routes use the same least-privilege PostgreSQL identities. The session
; routes remain available for controlled rollout and immediate configuration-only rollback.
polymarket_ingester_master_tx = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=transaction pool_size=2 max_db_connections=2 max_db_client_connections=8
polymarket_ingester_worker_tx = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=transaction pool_size=8 max_db_connections=8 max_db_client_connections=96
polymarket_observe_tx = host=timescaledb-0 port=5432 dbname=polymarket pool_mode=transaction pool_size=2 max_db_connections=2 max_db_client_connections=8

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
; Session pooling remains the safe default and is required by trading SQLx queries using
; persistent(false), which need backend affinity across Parse/Sync and Bind/Execute boundaries.
pool_mode = session
max_client_conn = 128
; The global application ceiling remains 30 PostgreSQL backends while session and transaction
; aliases coexist, leaving 10 direct slots below PostgreSQL max_connections=40. Dynamic worker
; clients queue behind the bounded transaction pool instead of scaling backend use per replica.
default_pool_size = 2
max_db_connections = 30
reserve_pool_size = 0
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
server_connect_timeout = 5
server_login_retry = 2
server_check_delay = 10
server_tls_sslmode = disable
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
