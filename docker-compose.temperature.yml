name: capitonic-temperature-expectancy

x-weather-environment: &weather-environment
  POSTGRES_HOST: "temperature-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "temperature_expectancy"
  WEATHER_CACHE_DIR: "/var/lib/weather/cache"
  WEATHER_MODEL_DIR: "/var/lib/weather/models"
  WEATHER_REPORT_DIR: "/var/lib/weather/reports"
  GOES_PATCH_DIR: "/var/lib/weather/satellite/goes"
  HRRR_ENVIRONMENT_DIR: "/var/lib/weather/hrrr-environment"
  WEATHER_TRAINING_SNAPSHOT_DIR: "/var/lib/weather/training-snapshots"
  POLYMARKET_GAMMA_BASE_URL: "https://gamma-api.polymarket.com"
  POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
  POLYMARKET_PMXT_ARCHIVE_BASE_URL: "https://r2v2.pmxt.dev"
  IEM_ASOS_METAR_URL: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
  IEM_ASOS_ONE_MINUTE_URL: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos1min.py"
  WEATHER_WORKER_POLL_SECONDS: "2"
  WEATHER_WORKER_LEASE_SECONDS: "1800"
  WEATHER_WORKER_INGESTERS: "polymarket_temperature_markets,asos_station_observations,asos_resolution_observations,asos_one_minute_observations,hrrr_point_forecasts,pmxt_temperature_execution"
  HRRR_DOWNLOAD_ATTEMPTS: "8"
  HRRR_RETRY_BASE_MS: "1000"
  HRRR_RETRY_MAX_MS: "30000"
  HRRR_REQUEST_INTERVAL_MS: "500"
  HRRR_SOURCE_PRIORITY: "google,aws,nomads"
  PMXT_DOWNLOAD_ATTEMPTS: "6"
  PMXT_RETRY_BASE_SECONDS: "2"
  NOAA_DOWNLOAD_ATTEMPTS: "6"
  NOAA_RETRY_BASE_SECONDS: "2"
  HERBIE_CONFIG_PATH: "/tmp/herbie-config.toml"

x-weather-worker: &weather-worker
  build:
    context: .
    dockerfile: packages/nyc-temperature-model/Dockerfile
    args:
      POLYMARKET_GIT_REVISION: ${POLYMARKET_GIT_REVISION:-}
  image: capitonic/nyc-temperature-model:local
  init: true
  mem_limit: 2g
  cpus: "1.5"
  pids_limit: 192
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  volumes:
    - ${WEATHER_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/temperature-expectancy}:/var/lib/weather
  networks:
    - temperature-data
    - temperature-sources
  depends_on:
    temperature-db-migrate:
      condition: service_completed_successfully
  restart: unless-stopped

x-pmxt-worker: &pmxt-worker
  <<: *weather-worker
  image: capitonic/nyc-temperature-pmxt-worker:${PMXT_WORKER_IMAGE_TAG:-archive-integrity-v2}

services:
  temperature-postgres:
    image: postgres:16-alpine
    shm_size: 256m
    mem_limit: 2g
    cpus: "1.5"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "temperature_expectancy"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=20
    volumes:
      - ${WEATHER_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/temperature-expectancy}/postgres:/var/lib/postgresql/data
    networks:
      - temperature-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temperature_expectancy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  temperature-db-migrate:
    build:
      context: .
      dockerfile: packages/db-migrate/Dockerfile
    image: capitonic/temperature-db-migrate:local
    command: ["npm", "run", "weather:migration:run"]
    mem_limit: 256m
    cpus: "0.25"
    environment:
      POSTGRES_HOST: "temperature-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "temperature_expectancy"
    volumes:
      - ./packages/db-migrate/src/migrations/weather/1787331600000-AddTemperaturePmxtLastTradePrices.ts:/usr/src/app/src/migrations/weather/1787331600000-AddTemperaturePmxtLastTradePrices.ts:ro
      - ./packages/db-migrate/src/migrations/weather/1787659200000-AddTemperaturePmxtTradeWindowCoverage.ts:/usr/src/app/src/migrations/weather/1787659200000-AddTemperaturePmxtTradeWindowCoverage.ts:ro
      - ./packages/db-migrate/src/migrations/weather/1787760000000-AddTemperatureEnvironmentalFeatures.ts:/usr/src/app/src/migrations/weather/1787760000000-AddTemperatureEnvironmentalFeatures.ts:ro
      - ./packages/db-migrate/src/migrations/weather/1787763600000-RequeueEnvironmentalSourceAliasRecovery.ts:/usr/src/app/src/migrations/weather/1787763600000-RequeueEnvironmentalSourceAliasRecovery.ts:ro
      - ./packages/db-migrate/src/migrations/weather/1787767200000-AddTemperatureSpatialGradients.ts:/usr/src/app/src/migrations/weather/1787767200000-AddTemperatureSpatialGradients.ts:ro
    networks:
      - temperature-data
    depends_on:
      temperature-postgres:
        condition: service_healthy
    restart: "no"

  temperature-worker-1:
    <<: *pmxt-worker
    command: ["worker"]
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-worker-1"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/worker-1"

  temperature-worker-2:
    <<: *pmxt-worker
    command: ["worker"]
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-worker-2"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/worker-2"

  temperature-worker-3:
    <<: *pmxt-worker
    command: ["worker"]
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-worker-3"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/worker-3"

  temperature-worker-4:
    <<: *pmxt-worker
    command: ["worker"]
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-worker-4"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/worker-4"

  temperature-price-history-worker-1:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 768m
    cpus: "0.5"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-price-history-worker-1"
      WEATHER_WORKER_INGESTERS: "polymarket_temperature_price_history"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/price-history-worker-1"

  temperature-price-history-worker-2:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 768m
    cpus: "0.5"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-price-history-worker-2"
      WEATHER_WORKER_INGESTERS: "polymarket_temperature_price_history"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/price-history-worker-2"

  temperature-price-history-worker-3:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 768m
    cpus: "0.5"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-price-history-worker-3"
      WEATHER_WORKER_INGESTERS: "polymarket_temperature_price_history"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/price-history-worker-3"

  temperature-price-history-worker-4:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 768m
    cpus: "0.5"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-price-history-worker-4"
      WEATHER_WORKER_INGESTERS: "polymarket_temperature_price_history"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/price-history-worker-4"

  temperature-environment-worker-1:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 4g
    cpus: "2.0"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-environment-worker-1"
      WEATHER_WORKER_INGESTERS: "goes_abi_klga_features,hrrr_environment_features"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/environment-worker-1"

  temperature-environment-worker-2:
    <<: *weather-worker
    command: ["worker"]
    mem_limit: 4g
    cpus: "2.0"
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-environment-worker-2"
      WEATHER_WORKER_INGESTERS: "goes_abi_klga_features,hrrr_environment_features"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/environment-worker-2"

  temperature-model:
    <<: *weather-worker
    profiles: ["tools"]
    command: ["readiness"]
    environment:
      <<: *weather-environment
      WEATHER_WORKER_ID: "temperature-model-runner"
      WEATHER_CACHE_DIR: "/var/lib/weather/cache/tools"
    restart: "no"

networks:
  temperature-data:
    internal: true
  temperature-sources:
