  kraken-timescaledb:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: kraken-timescaledb
    hostname: kraken-timescaledb
    mem_limit: 2g
    cpus: "1.5"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "kraken_archive"
      TS_TUNE_MEMORY: "2GB"
      TS_TUNE_NUM_CPUS: "2"
      TS_TUNE_MAX_CONNS: "20"
      TS_TUNE_MAX_BG_WORKERS: "2"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=4
      - -c
      - timescaledb.max_background_workers=2
    ports:
      - "127.0.0.1:${KRAKEN_POSTGRES_HOST_PORT:-55434}:5432"
    volumes:
      - /Volumes/docker-data/kraken-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kraken_archive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kraken-db-migrate:
    build:
      context: .
      dockerfile: packages/db-migrate/Dockerfile
    image: polymarket/db-migrate:latest
    container_name: kraken-db-migrate
    hostname: kraken-db-migrate
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      NODE_ENV: "development"
      POSTGRES_HOST: "kraken-timescaledb"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "kraken_archive"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
      DB_MIGRATIONS_PATTERN: "migrations/kraken/*.{ts,js}"
    depends_on:
      kraken-timescaledb:
        condition: service_healthy
    restart: "no"

