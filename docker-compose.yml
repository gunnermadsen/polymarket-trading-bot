x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env-file: &app-env-file
  path: ./.env
  required: false

x-postgres-env-file: &postgres-env-file
  path: ./.env.postgres
  required: false

x-grafana-env-file: &grafana-env-file
  path: ./.env.grafana
  required: false

x-kraken-worker-env: &kraken-worker-env
  RUST_LOG: "info,sqlx=error"
  POSTGRES_HOST: "kraken-timescaledb"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "kraken_archive"
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_SSL_CA_FILE: ""
  KRAKEN_FUTURES_BASE_URL: "https://futures.kraken.com"
  KRAKEN_DATA_LAKE_ROOT: "/var/lib/kraken-data"
  KRAKEN_BACKFILL_POLL_INTERVAL_MS: "1000"
  KRAKEN_BACKFILL_LEASE_DURATION_SECS: "120"
  KRAKEN_BACKFILL_HEARTBEAT_INTERVAL_SECS: "20"
  KRAKEN_BACKFILL_DB_POOL_MAX_CONNECTIONS: "1"

x-kraken-worker: &kraken-worker
  build:
    context: .
    dockerfile: packages/polymarket-bot/Dockerfile
    args:
      POLYMARKET_GIT_REVISION: ${POLYMARKET_GIT_REVISION:-}
  image: polymarket/kraken-ingestion:latest
  entrypoint:
    - /usr/local/bin/kraken-backfill-worker
  init: true
  mem_limit: 512m
  cpus: "0.35"
  pids_limit: 128
  logging: *default-logging
  env_file:
    - *postgres-env-file
  volumes:
    - /Volumes/docker-data/kraken-data:/var/lib/kraken-data
  depends_on:
    kraken-db-migrate:
      condition: service_completed_successfully
    kraken-timescaledb:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  stop_grace_period: 60s
  restart: unless-stopped

services:
  timescaledb-0:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb-0
    hostname: timescaledb-0
    mem_limit: 6g
    cpus: "4"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      TS_TUNE_MEMORY: "6GB"
      TS_TUNE_NUM_CPUS: "4"
      TS_TUNE_MAX_CONNS: "25"
      TS_TUNE_MAX_BG_WORKERS: "4"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=10485kB
      - -c
      - max_connections=25
      - -c
      - max_locks_per_transaction=128
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=8
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:${POLYMARKET_POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - timescaledb-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.25.2-p0}
    container_name: pgbouncer
    hostname: pgbouncer
    init: true
    mem_limit: 128m
    cpus: "0.15"
    pids_limit: 64
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/capitonic-pgbouncer-entrypoint.sh
    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"
    volumes:
      - ./common/configs/pgbouncer:/etc/pgbouncer:ro
      - ./common/scripts/pgbouncer-entrypoint.sh:/usr/local/bin/capitonic-pgbouncer-entrypoint.sh:ro
    depends_on:
      timescaledb-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "postgres", "-d", "polymarket"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: packages/db-migrate/Dockerfile
    image: polymarket/db-migrate:latest
    container_name: db-migrate
    hostname: db-migrate
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      NODE_ENV: "development"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: "no"

  polymarket-bot:
    build:
      context: .
      dockerfile: packages/polymarket-bot/Dockerfile
      args:
        POLYMARKET_GIT_REVISION: ${POLYMARKET_GIT_REVISION:-}
    image: ${POLYMARKET_BOT_IMAGE:-polymarket/polymarket-bot:btc-paper}
    container_name: polymarket-bot
    hostname: polymarket-bot
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
      - *grafana-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "pgbouncer"
      POSTGRES_PORT: "6432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_FUNDER_ADDRESS: "${POLYMARKET_FUNDER_ADDRESS:-}"
      POLYMARKET_SIGNATURE_TYPE: "${POLYMARKET_SIGNATURE_TYPE:-POLY_1271}"
      POLYMARKET_LIVE_USER_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
      POLYMARKET_LIVE_USER_WS_STALE_SECS: "20"
      POLYMARKET_LIVE_RECONCILE_INTERVAL_SECS: "30"
      POLYMARKET_LIVE_STALE_RECONCILE_SECS: "60"
      POLYMARKET_BTC_RTDS_WS_URL: "wss://ws-live-data.polymarket.com"
      POLYMARKET_BTC_BINANCE_WS_URL: "wss://stream.binance.com/ws/btcusdt@aggTrade"
      POLYMARKET_BTC_BINANCE_SPOT_L2_ENABLED: "true"
      POLYMARKET_BTC_BINANCE_SPOT_L2_WS_URL: "wss://stream.binance.com/ws/btcusdt@depth@100ms"
      POLYMARKET_BTC_BINANCE_REST_BASE_URL: "https://data-api.binance.vision"
      POLYMARKET_BTC_DIRECTIONAL_EXTERNAL_ENABLED: "true"
      POLYMARKET_BTC_CHAINLINK_REFPRICE_POLL_MS: "2000"
      POLYMARKET_BTC_POLYGON_ORACLE_POLL_MS: "2000"
      POLYMARKET_BTC_BINANCE_OI_POLL_MS: "60000"
      POLYMARKET_CHAINLINK_DATA_STREAMS_REST_URL: "https://api.dataengine.chain.link"
