name: polymarket-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-app-env-file: &app-env-file
  path: ./.env
  required: false
x-postgres-env-file: &postgres-env-file
  path: ./.env.postgres
  required: false
x-grafana-env-file: &grafana-env-file
  path: ./.env.grafana
  required: false
x-prometheus-env-file: &prometheus-env-file
  path: ./.env.prometheus
  required: true
  format: raw
x-ingester-environment: &ingester-environment
  RUST_LOG: "info"
  POSTGRES_HOST: "pgbouncer"
  POSTGRES_PORT: "6432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "polymarket"
  POSTGRES_SSL_MODE: "disable"
  MARKET_DATA_INGESTER_DB_POOL_CONNECTIONS: "4"
  MARKET_DATA_INGESTER_CONTROL_DB_POOL_CONNECTIONS: "1"
  MARKET_DATA_INGESTER_DB_ACQUIRE_TIMEOUT_SECS: "10"
  MARKET_DATA_INGESTER_CONTROL_DB_ACQUIRE_TIMEOUT_SECS: "3"
  MARKET_DATA_INGESTER_CHAINLINK_DATA_STREAMS_API_KEY: "${POLYMARKET_CHAINLINK_DATA_STREAMS_API_KEY:-}"
  MARKET_DATA_INGESTER_CHAINLINK_DATA_STREAMS_API_SECRET: "${POLYMARKET_CHAINLINK_DATA_STREAMS_API_SECRET:-}"
  MARKET_DATA_INGESTER_CHAINLINK_DATA_STREAMS_CANDLESTICK_API_KEY: "${POLYMARKET_CHAINLINK_DATA_STREAMS_CANDLESTICK_API_KEY:-}"
x-ingester-runtime: &ingester-runtime
  init: true
  mem_limit: 4g
  cpus: "2.0"
  pids_limit: 256
  logging: *default-logging
  env_file:
    - *postgres-env-file
    - path: .env.market-data-ingester
      required: false
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  stop_grace_period: 120s
  restart: unless-stopped
services:
  timescaledb-0:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb-0
    hostname: timescaledb-0
    mem_limit: 6g
    cpus: "4"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      TS_TUNE_MEMORY: "6GB"
      TS_TUNE_NUM_CPUS: "4"
      # Capacity budget: 24 session-pooled application backends plus 8 slots for
      # db-migrate, administration, and exceptional direct connections.
      TS_TUNE_MAX_CONNS: "32"
      TS_TUNE_MAX_BG_WORKERS: "4"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=10485kB
      - -c
      - max_connections=32
      - -c
      - max_locks_per_transaction=128
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=8
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:${POLYMARKET_POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - timescaledb-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.25.2-p0}
    container_name: pgbouncer
    hostname: pgbouncer
    init: true
    mem_limit: 128m
    cpus: "0.15"
    pids_limit: 64
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/capitonic-pgbouncer-entrypoint.sh
    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"
    volumes:
      - ./common/configs/pgbouncer:/etc/pgbouncer:ro
      - ./common/scripts/pgbouncer-entrypoint.sh:/usr/local/bin/capitonic-pgbouncer-entrypoint.sh:ro
    depends_on:
      timescaledb-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "postgres", "-d", "polymarket"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: unless-stopped
  db-migrate:
    build:
      context: .
      dockerfile: packages/db-migrate/Dockerfile
    image: polymarket/db-migrate:latest
    container_name: db-migrate
    hostname: db-migrate
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      NODE_ENV: "development"
      POSTGRES_HOST: "${DB_MIGRATE_POSTGRES_HOST:-timescaledb-0}"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "${DB_MIGRATE_POSTGRES_DB:-polymarket}"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
      DB_MIGRATIONS_PATTERN: "${DB_MIGRATIONS_PATTERN:-migrations/*.{ts,js}}"
    command: ${DB_MIGRATE_COMMAND:-npm run start:dev}
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: "no"
  ingester-master:
    <<: *ingester-runtime
    profiles: [data-ingestion]
    build:
      context: .
      dockerfile: packages/market-data-ingester/Dockerfile
      target: master
      args:
        INGESTER_GIT_REVISION: ${INGESTER_GIT_REVISION:-}
    image: ${INGESTER_MASTER_IMAGE:-capitonic/ingester-master:development}
    container_name: ingester-master
    hostname: ingester-master
    mem_limit: 512m
    cpus: "1.0"
    environment:
      <<: *ingester-environment
      INGESTER_MODE: "master"
      INGESTER_INSTANCE: "ingester-master"
      INGESTER_API_BIND: "0.0.0.0:8098"
      MARKET_DATA_INGESTER_DB_POOL_CONNECTIONS: "1"
    ports:
      - "127.0.0.1:8099:8098"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8098/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  ingester-worker:
    <<: *ingester-runtime
    profiles: [data-ingestion]
    build:
      context: .
      dockerfile: packages/market-data-ingester/Dockerfile
      target: worker
      args:
        INGESTER_GIT_REVISION: ${INGESTER_GIT_REVISION:-}
    image: ${INGESTER_WORKER_IMAGE:-capitonic/ingester-worker:development}
    environment:
      <<: *ingester-environment
      INGESTER_MODE: "worker"
      INGESTER_GRPC_BIND: "0.0.0.0:50051"
      INGESTER_WORKER_METRICS_BIND: "0.0.0.0:8099"
      MARKET_DATA_INGESTER_DB_POOL_CONNECTIONS: "1"
      INGESTER_MASTER_URL: "http://ingester-master:8098"
      INGESTER_DEPLOYMENT_ID: "${INGESTER_DEPLOYMENT_ID:-default}"
      INGESTER_WORKER_MAX_BACKFILLS: "1"
      INGESTER_IMAGE_DIGEST: "${INGESTER_IMAGE_DIGEST:-development}"
      INGESTER_GIT_REVISION: "${INGESTER_GIT_REVISION:-development}"
      BINANCE_ARCHIVE_BASE_URL: "https://data.binance.vision"
      BINANCE_FUTURES_DATA_BASE_URL: "https://fapi.binance.com"
      CRYPTOHFT_BASE_URL: "https://api.cryptohftdata.com"
      INGESTER_BINANCE_CACHE_DIRECTORY: "/var/lib/binance-l2/binance-public"
      INGESTER_CRYPTOHFT_ARCHIVE_ROOT: "/var/lib/binance-l2"
      INGESTER_CRYPTOHFT_TEMPORARY_DIRECTORY: "/var/lib/binance-l2/tmp"
      CHAINLINK_DATA_STREAMS_REST_URL: "https://api.dataengine.chain.link"
      CHAINLINK_CANDLESTICK_BASE_URL: "https://priceapi.dataengine.chain.link"
      POLYGON_RPC_URL: "${POLYMARKET_POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"
      POLYGON_ARCHIVE_LOG_RPC_URL: "${POLYMARKET_POLYGON_ARCHIVE_LOG_RPC_URL:-https://tenderly.rpc.polygon.community}"
      PMDATA_BASE_URL: "https://api.pmdata.dev"
      INGESTER_PMDATA_ARCHIVE_ROOT: "/tmp/pmdata"
      KRAKEN_FUTURES_BASE_URL: "https://futures.kraken.com"
      KRAKEN_SPOT_BASE_URL: "https://api.kraken.com"
      INGESTER_KRAKEN_DATA_ROOT: "/var/lib/kraken-data"
      INGESTER_FINANCIAL_DATA_ROOT: "/var/lib/financial-data"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      INGESTER_WEATHER_RAW_ROOT: "/var/lib/weather/raw"
      INGESTER_WEATHER_CURATED_ROOT: "/var/lib/weather/curated"
    volumes:
      - ${WEATHER_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/temperature-expectancy}:/var/lib/weather
      - ${BINANCE_L2_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/binance-l2}:/var/lib/binance-l2
      - ${KRAKEN_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/kraken-data}:/var/lib/kraken-data
      - ${FINANCIAL_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/global-financial-data}:/var/lib/financial-data
    depends_on:
      ingester-master:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  polymarket-bot:
    build:
      context: .
      dockerfile: packages/polymarket-bot/Dockerfile
      args:
        POLYMARKET_GIT_REVISION: ${POLYMARKET_GIT_REVISION:-}
    image: ${POLYMARKET_BOT_IMAGE:-polymarket/polymarket-bot:btc-paper}
    container_name: polymarket-bot
    hostname: polymarket-bot
    mem_limit: 512m
    cpus: "2.0"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
      - *grafana-env-file
      - path: ./.env.market-data-ingester
        required: true
    environment:
      RUST_LOG: "info"
      TOKIO_WORKER_THREADS: "2"
      INGESTER_MASTER_URL: "http://ingester-master:8098"
      POSTGRES_HOST: "pgbouncer"
      POSTGRES_PORT: "6432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_FUNDER_ADDRESS: "${POLYMARKET_FUNDER_ADDRESS:-}"
      POLYMARKET_SIGNATURE_TYPE: "${POLYMARKET_SIGNATURE_TYPE:-POLY_1271}"
      POLYMARKET_LIVE_USER_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
      POLYMARKET_LIVE_USER_WS_STALE_SECS: "20"
      POLYMARKET_LIVE_RECONCILE_INTERVAL_SECS: "30"
      POLYMARKET_LIVE_STALE_RECONCILE_SECS: "60"
      POLYMARKET_POLYGON_RPC_URL: "${POLYMARKET_POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_DATA_API_BASE_URL: "https://data-api.polymarket.com"
      POLYMARKET_HEALTH_INTERVAL_SECS: "30"
      POLYMARKET_HTTP_ENABLED: "true"
      POLYMARKET_HTTP_BIND: "0.0.0.0:8097"
      POLYMARKET_GRAFANA_LIVE_ENABLED: "true"
      POLYMARKET_GRAFANA_LIVE_PUSH_URL: "http://grafana:3000/api/live/push/polymarket"
      POLYMARKET_GRAFANA_LIVE_PUBLISH_INTERVAL_MS: "1000"
    ports:
      - "127.0.0.1:${POLYMARKET_HTTP_HOST_PORT:-8098}:8097"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: prometheus
    hostname: prometheus
    init: true
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/prometheus-provisioning-entrypoint.sh
    command:
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
    env_file:
      - *prometheus-env-file
    environment:
      PROMETHEUS_ENVIRONMENT: "development"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./common/configs/prometheus:/etc/prometheus-src:ro
      - ./common/scripts/prometheus-provisioning-entrypoint.sh:/usr/local/bin/prometheus-provisioning-entrypoint.sh:ro
      - ./common/scripts/prometheus-healthcheck.sh:/usr/local/bin/prometheus-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/prometheus-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: loki
    hostname: loki
    init: true
    mem_limit: 384m
    cpus: "0.25"
    pids_limit: 128
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ./common/configs/loki/loki.yml:/etc/loki/loki.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: alloy
    hostname: alloy
    init: true
    mem_limit: 128m
    cpus: "0.15"
    pids_limit: 128
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./common/configs/alloy/market-data-ingester.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    container_name: grafana
    hostname: grafana
    mem_limit: 512m
    cpus: "0.50"
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/grafana-provisioning-entrypoint.sh
    env_file:
      - *postgres-env-file
      - *grafana-env-file
      - *prometheus-env-file
    environment:
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "browser"
      GRAFANA_POSTGRES_HOST: "pgbouncer"
      GRAFANA_POSTGRES_PORT: "6432"
      GRAFANA_POSTGRES_MAX_OPEN_CONNS: "2"
      GRAFANA_POSTGRES_MAX_IDLE_CONNS: "1"
      GRAFANA_ALERT_ENVIRONMENT: "development"
      GRAFANA_PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_LOKI_URL: "http://loki:3100"
      PROMETHEUS_ENVIRONMENT: "development"
      GF_UNIFIED_ALERTING_STATE_HISTORY_ENABLED: "true"
      GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND: "loki"
      GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL: "http://loki:3100"
      GF_FEATURE_TOGGLES_ENABLE: "alertingCentralAlertHistory"
      GF_LIVE_MAX_CONNECTIONS: "100"
      GF_LIVE_ALLOWED_ORIGINS: "http://localhost:3030,http://127.0.0.1:3030"
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource@3.11.1"
      POLYMARKET_HTTP_ADMIN_TOKEN: "${POLYMARKET_HTTP_ADMIN_TOKEN:-dev-polymarket-admin}"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./common/configs/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./common/configs/grafana/dashboards:/etc/grafana/dashboards/polymarket-bot:ro
      - ./common/scripts/grafana-provisioning-entrypoint.sh:/usr/local/bin/grafana-provisioning-entrypoint.sh:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
volumes:
  timescaledb-0-data:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
