x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env-file: &app-env-file
  path: ./.env
  required: false

x-postgres-env-file: &postgres-env-file
  path: ./.env.postgres
  required: false

x-grafana-env-file: &grafana-env-file
  path: ./.env.grafana
  required: false

x-btc-paper-env: &btc-paper-env
  POLYMARKET_LIVE_ORDER_SUBMIT_ENABLED: "false"
  POLYMARKET_LIVE_USER_WS_ENABLED: "false"
  POLYMARKET_SCAN_ENABLED: "false"
  POLYMARKET_SIGNAL2_ENABLED: "false"
  POLYMARKET_SIGNAL3_ENABLED: "false"
  POLYMARKET_COPY_TRADE_ENABLED: "false"
  POLYMARKET_COPY_EXECUTE_ENABLED: "false"
  POLYMARKET_WHALE_LIVE_ENABLED: "false"
  POLYMARKET_WHALE_BACKFILL_ENABLED: "false"
  POLYMARKET_BTC_REALTIME_ENABLED: "true"
  POLYMARKET_BTC_PAPER_ENABLED: "true"
  POLYMARKET_BTC_ML_SHADOW_ENABLED: "true"
  POLYMARKET_BTC_RTDS_WS_URL: "wss://ws-live-data.polymarket.com"
  POLYMARKET_BTC_BINANCE_WS_URL: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  POLYMARKET_CLOB_API_KEY: ""
  POLYMARKET_CLOB_SECRET: ""
  POLYMARKET_CLOB_PASSPHRASE: ""
  POLYMARKET_PRIVATE_KEY: ""
  POLYMARKET_FUNDER_ADDRESS: ""
  POLYMARKET_SIGNATURE_TYPE: ""

services:
  timescaledb-0:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb-0
    hostname: timescaledb-0
    mem_limit: 2g
    cpus: "0.65"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      TS_TUNE_MEMORY: "2GB"
      TS_TUNE_NUM_CPUS: "1"
      TS_TUNE_MAX_CONNS: "25"
      TS_TUNE_MAX_BG_WORKERS: "4"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=10485kB
      - -c
      - max_connections=25
      - -c
      - max_locks_per_transaction=128
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_worker_processes=8
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:${POLYMARKET_POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - timescaledb-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: packages/db-migrate/Dockerfile
    image: polymarket/db-migrate:latest
    container_name: db-migrate
    hostname: db-migrate
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      NODE_ENV: "development"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: "no"

  polymarket-bot:
    build:
      context: .
      dockerfile: packages/polymarket-bot/Dockerfile
    image: polymarket/polymarket-bot:btc-paper
    container_name: polymarket-bot
    hostname: polymarket-bot
    mem_limit: 512m
    cpus: "0.30"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      <<: *btc-paper-env
      RUST_LOG: "info"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_LIVE_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_GAMMA_BASE_URL: "https://gamma-api.polymarket.com"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_CLOB_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
      POLYMARKET_DATA_API_BASE_URL: "https://data-api.polymarket.com"
      POLYMARKET_HEALTH_INTERVAL_SECS: "30"
      POLYMARKET_HTTP_ENABLED: "true"
      POLYMARKET_HTTP_BIND: "0.0.0.0:8097"
      POLYMARKET_EXIT_CANDIDATE_MAX_AGE_SECONDS: "900"
      POLYMARKET_MARK_FRESH_MAX_AGE_SECS: "300"
    ports:
      - "127.0.0.1:${POLYMARKET_HTTP_HOST_PORT:-8098}:8097"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      timescaledb-0:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  polymarket-backfill-worker:
    build:
      context: .
      dockerfile: packages/polymarket-bot/Dockerfile
    image: polymarket/polymarket-bot:btc-paper
    container_name: polymarket-backfill-worker
    hostname: polymarket-backfill-worker
    entrypoint:
      - /usr/local/bin/polymarket-backfill-worker
    init: true
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_GAMMA_BASE_URL: "https://gamma-api.polymarket.com"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_BACKFILL_CACHE_DIR: "/var/lib/polymarket/backfill-cache"
      POLYMARKET_BACKFILL_WORKER_ID: "polymarket-backfill-worker"
      POLYMARKET_BACKFILL_POLL_INTERVAL_MS: "1000"
      POLYMARKET_BACKFILL_LEASE_SECS: "60"
      POLYMARKET_BACKFILL_HEARTBEAT_SECS: "15"
      POLYMARKET_BACKFILL_DB_POOL_MAX_CONNECTIONS: "4"
      POLYMARKET_BACKFILL_BATCH_ROWS: "4000"
    volumes:
      - polymarket-backfill-cache:/var/lib/polymarket/backfill-cache
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      timescaledb-0:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 60s
    restart: unless-stopped

  polymarket-bot-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: packages/polymarket-bot/Dockerfile
      target: test
    image: polymarket/polymarket-bot-test:btc-paper
    mem_limit: 1g
    cpus: "1.0"
    logging: *default-logging
    restart: "no"

  btc-paper-audit:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: packages/btc-paper-audit/Dockerfile
    image: polymarket/btc-paper-audit:latest
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      <<: *btc-paper-env
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POLYMARKET_DB_USER: "postgres"
      POLYMARKET_DB_NAME: "polymarket"
      POLYMARKET_HTTP_BASE_URL: "http://polymarket-bot:8097"
      BTC_PAPER_EXPERIMENT_MANIFEST_PATH: "/workspace/docs/experiments/btc-5m-chainlink-fair-value-20260713-c/preregistration.json"
    volumes:
      - ./docs/evidence:/workspace/docs/evidence
    depends_on:
      timescaledb-0:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  btc-ml-research:
    profiles: ["research"]
    build:
      context: .
      dockerfile: experiments/btc-updown/Dockerfile
    image: polymarket/btc-ml-research:latest
    mem_limit: 1g
    cpus: "1.0"
    logging: *default-logging
    volumes:
      - btc-ml-datasets:/datasets:ro
      - btc-ml-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    container_name: grafana
    hostname: grafana
    mem_limit: 256m
    cpus: "0.20"
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/grafana-provisioning-entrypoint.sh
    env_file:
      - *postgres-env-file
      - *grafana-env-file
    environment:
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "browser"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./common/configs/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./common/configs/grafana/dashboards:/etc/grafana/dashboards/polymarket-bot:ro
      - ./common/scripts/grafana-provisioning-entrypoint.sh:/usr/local/bin/grafana-provisioning-entrypoint.sh:ro
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb-0-data:
  grafana-data:
  btc-ml-datasets:
  btc-ml-artifacts:
  polymarket-backfill-cache:
