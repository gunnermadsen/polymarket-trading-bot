x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env-file: &app-env-file
  path: ./.env
  required: false

x-postgres-env-file: &postgres-env-file
  path: ./.env.postgres
  required: false

x-grafana-env-file: &grafana-env-file
  path: ./.env.grafana
  required: false

x-watchtower-labels: &watchtower-labels
  com.centurylinklabs.watchtower.enable: "true"

services:
  timescaledb-0:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb-0
    hostname: timescaledb-0
    mem_limit: 2g
    cpus: "0.65"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      TS_TUNE_MEMORY: "2GB"
      TS_TUNE_NUM_CPUS: "1"
      TS_TUNE_MAX_CONNS: "25"
      TS_TUNE_MAX_BG_WORKERS: "4"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=10485kB
      - -c
      - max_connections=25
      - -c
      - max_locks_per_transaction=128
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_worker_processes=8
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - timescaledb-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-migrate:
    image: 192200846560.dkr.ecr.mx-central-1.amazonaws.com/capitonic/db-migrate:production
    container_name: db-migrate
    hostname: db-migrate
    mem_limit: 256m
    cpus: "0.25"
    labels: *watchtower-labels
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      NODE_ENV: "development"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: "no"

  polymarket-bot:
    image: 192200846560.dkr.ecr.mx-central-1.amazonaws.com/capitonic/polymarket-bot:production
    container_name: polymarket-bot
    hostname: polymarket-bot
    mem_limit: 512m
    cpus: "0.30"
    labels: *watchtower-labels
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_LIVE_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_LIVE_ACCOUNT_REF: "polymarket-primary"
      POLYMARKET_FUNDER_ADDRESS: "${POLYMARKET_FUNDER_ADDRESS:-}"
      POLYMARKET_SIGNATURE_TYPE: "${POLYMARKET_SIGNATURE_TYPE:-POLY_1271}"
      POLYMARKET_LIVE_ORDER_SUBMIT_ENABLED: "false"
      POLYMARKET_LIVE_MAX_ORDER_NOTIONAL_USD: "2"
      POLYMARKET_LIVE_MAX_OPEN_NOTIONAL_USD: "20"
      POLYMARKET_LIVE_MAX_DAILY_LOSS_USD: "10"
      POLYMARKET_LIVE_MAX_OPEN_POSITIONS: "6"
      POLYMARKET_LIVE_REQUIRE_EXIT_BOOK: "true"
      POLYMARKET_LIVE_REQUIRE_IDEMPOTENCY_CLEAN: "true"
      POLYMARKET_LIVE_USER_WS_ENABLED: "false"
      POLYMARKET_LIVE_USER_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
      POLYMARKET_LIVE_USER_WS_STALE_SECS: "20"
      POLYMARKET_LIVE_RECONCILE_INTERVAL_SECS: "30"
      POLYMARKET_LIVE_STALE_RECONCILE_SECS: "60"
      POLYMARKET_BTC_REALTIME_ENABLED: "false"
      POLYMARKET_BTC_PAPER_ENABLED: "false"
      POLYMARKET_BTC_RTDS_WS_URL: "wss://ws-live-data.polymarket.com"
      POLYMARKET_BTC_BINANCE_WS_URL: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
      POLYMARKET_BTC_CLOB_HEARTBEAT_INTERVAL_SECS: "10"
      POLYMARKET_BTC_CLOB_PONG_TIMEOUT_SECS: "25"
      POLYMARKET_BTC_RTDS_HEARTBEAT_INTERVAL_SECS: "5"
      POLYMARKET_BTC_BINANCE_HEARTBEAT_INTERVAL_SECS: "20"
      POLYMARKET_GAMMA_BASE_URL: "https://gamma-api.polymarket.com"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_CLOB_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
      POLYMARKET_DATA_API_BASE_URL: "https://data-api.polymarket.com"
      POLYMARKET_HEALTH_INTERVAL_SECS: "30"
      POLYMARKET_HTTP_ENABLED: "true"
      POLYMARKET_HTTP_BIND: "0.0.0.0:8097"
    ports:
      - "127.0.0.1:8097:8097"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      timescaledb-0:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  polymarket-backfill-worker:
    image: 192200846560.dkr.ecr.mx-central-1.amazonaws.com/capitonic/polymarket-bot:production
    container_name: polymarket-backfill-worker
    hostname: polymarket-backfill-worker
    entrypoint:
      - /usr/local/bin/polymarket-backfill-worker
    init: true
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    labels: *watchtower-labels
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_GAMMA_BASE_URL: "https://gamma-api.polymarket.com"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_PMXT_ARCHIVE_BASE_URL: "https://r2v2.pmxt.dev"
      POLYMARKET_CHAINLINK_DATA_STREAMS_REST_URL: "https://api.dataengine.chain.link"
      POLYMARKET_CHAINLINK_DATA_STREAMS_FEED_ID: "0x00039d9e45394f473ab1f050a1b963e6b05351e52d71e507509ada0c95ed75b8"
      POLYMARKET_CHAINLINK_DATA_STREAMS_PAGE_LIMIT: "1000"
      POLYMARKET_CHAINLINK_DATA_STREAMS_API_KEY: "${POLYMARKET_CHAINLINK_DATA_STREAMS_API_KEY:-}"
      POLYMARKET_CHAINLINK_DATA_STREAMS_API_SECRET: "${POLYMARKET_CHAINLINK_DATA_STREAMS_API_SECRET:-}"
      POLYMARKET_POLYGON_RPC_URL: "${POLYMARKET_POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"
      POLYMARKET_POLYGON_ARCHIVE_LOG_RPC_URL: "${POLYMARKET_POLYGON_ARCHIVE_LOG_RPC_URL:-https://tenderly.rpc.polygon.community}"
      POLYMARKET_POLYGON_CHAINLINK_BTCUSD_PROXY: "0xc907e116054ad103354f2d350fd2514433d57f6f"
      POLYMARKET_POLYGON_RPC_MAX_BLOCK_RANGE: "30000"
      POLYMARKET_BACKFILL_CACHE_DIR: "/var/lib/polymarket/backfill-cache"
      POLYMARKET_BACKFILL_WORKER_ID: "polymarket-backfill-worker"
      POLYMARKET_BACKFILL_POLL_INTERVAL_MS: "1000"
      POLYMARKET_BACKFILL_LEASE_SECS: "60"
      POLYMARKET_BACKFILL_HEARTBEAT_SECS: "15"
      POLYMARKET_BACKFILL_DB_POOL_MAX_CONNECTIONS: "4"
      POLYMARKET_BACKFILL_BATCH_ROWS: "4000"
    volumes:
      - polymarket-backfill-cache:/var/lib/polymarket/backfill-cache
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      timescaledb-0:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 60s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    container_name: grafana
    hostname: grafana
    mem_limit: 256m
    cpus: "0.20"
    labels: *watchtower-labels
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/grafana-provisioning-entrypoint.sh
    env_file:
      - *postgres-env-file
      - *grafana-env-file
    environment:
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "browser"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./common/configs/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./common/configs/grafana/dashboards:/etc/grafana/dashboards/polymarket-bot:ro
      - ./common/scripts/grafana-provisioning-entrypoint.sh:/usr/local/bin/grafana-provisioning-entrypoint.sh:ro
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    hostname: watchtower
    mem_limit: 128m
    cpus: "0.10"
    environment:
      DOCKER_API_VERSION: "1.44"
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command:
      - "--label-enable"
      - "--include-stopped"
      - "--revive-stopped"
      - "--cleanup"
      - "--interval"
      - "300"
    restart: unless-stopped

volumes:
  timescaledb-0-data:
  grafana-data:
  polymarket-backfill-cache:
