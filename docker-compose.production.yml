x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env-file: &app-env-file
  path: ./.env
  required: false
  format: raw

x-postgres-env-file: &postgres-env-file
  path: ./.env.postgres
  required: false
  format: raw
x-postgres-roles-env-file: &postgres-roles-env-file
  path: ./.env.postgres.roles
  required: true
  format: raw
x-postgres-pgbouncer-env-file: &postgres-pgbouncer-env-file
  path: ./.env.postgres.pgbouncer
  required: true
  format: raw
x-postgres-bot-env-file: &postgres-bot-env-file
  path: ./.env.postgres.polymarket-bot
  required: true
  format: raw
x-postgres-master-env-file: &postgres-master-env-file
  path: ./.env.postgres.ingester-master
  required: true
  format: raw
x-postgres-worker-env-file: &postgres-worker-env-file
  path: ./.env.postgres.ingester-worker
  required: true
  format: raw
x-postgres-grafana-env-file: &postgres-grafana-env-file
  path: ./.env.postgres.grafana
  required: true
  format: raw

x-grafana-env-file: &grafana-env-file
  path: ./.env.grafana
  required: false
  format: raw

x-prometheus-env-file: &prometheus-env-file
  path: ./.env.prometheus.production
  required: true
  format: raw

services:
  timescaledb-0:
    image: timescale/timescaledb:2.14.2-pg14
    container_name: timescaledb-0
    hostname: timescaledb-0
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    env_file:
      - *postgres-env-file
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      TS_TUNE_MEMORY: "2GB"
      TS_TUNE_NUM_CPUS: "2"
      # Capacity budget: 30 session-pooled application backends plus 10 slots for
      # db-migrate, administration, and exceptional direct connections.
      TS_TUNE_MAX_CONNS: "40"
      TS_TUNE_MAX_BG_WORKERS: "4"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - work_mem=10485kB
      - -c
      - max_connections=40
      - -c
      - max_locks_per_transaction=128
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_worker_processes=8
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - timescaledb-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.25.2-p0}
    container_name: pgbouncer
    hostname: pgbouncer
    init: true
    mem_limit: 128m
    cpus: "0.10"
    pids_limit: 64
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/capitonic-pgbouncer-entrypoint.sh
    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini
    env_file:
      - *postgres-env-file
      - *postgres-pgbouncer-env-file
    environment:
      POSTGRES_USER: "postgres"
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"
    volumes:
      - ./common/configs/pgbouncer:/etc/pgbouncer:ro
      - ./common/scripts/pgbouncer-entrypoint.sh:/usr/local/bin/capitonic-pgbouncer-entrypoint.sh:ro
    depends_on:
      timescaledb-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "postgres", "-d", "polymarket"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: unless-stopped

  db-migrate:
    image: ${DB_MIGRATE_IMAGE:-192200846560.dkr.ecr.eu-west-1.amazonaws.com/capitonic/db-migrate:production}
    container_name: db-migrate
    hostname: db-migrate
    mem_limit: 256m
    cpus: "0.5"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-env-file
      - *postgres-roles-env-file
      - path: ./.env.market-data-ingester
        required: true
        format: raw
    environment:
      NODE_ENV: "production"
      POSTGRES_HOST: "timescaledb-0"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "polymarket"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POSTGRES_SSL_CERT_FILE: ""
      POSTGRES_SSL_KEY_FILE: ""
    depends_on:
      timescaledb-0:
        condition: service_healthy
    restart: "no"

  polymarket-bot:
    image: ${POLYMARKET_BOT_IMAGE:-192200846560.dkr.ecr.eu-west-1.amazonaws.com/capitonic/polymarket-bot:production}
    container_name: polymarket-bot
    hostname: polymarket-bot
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    env_file:
      - *app-env-file
      - *postgres-bot-env-file
    environment:
      RUST_LOG: "info"
      TOKIO_WORKER_THREADS: "2"
      INGESTER_MASTER_URL: "http://ingester-master:8098"
      POSTGRES_HOST: "pgbouncer"
      POSTGRES_PORT: "6432"
      POSTGRES_USER: "capitonic_trading"
      POSTGRES_DB: "polymarket_trading"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      POLYMARKET_FUNDER_ADDRESS: "${POLYMARKET_FUNDER_ADDRESS:-}"
      POLYMARKET_SIGNATURE_TYPE: "${POLYMARKET_SIGNATURE_TYPE:-POLY_1271}"
      POLYMARKET_LIVE_USER_WS_URL: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
      POLYMARKET_LIVE_USER_WS_STALE_SECS: "20"
      POLYMARKET_LIVE_RECONCILE_INTERVAL_SECS: "30"
      POLYMARKET_LIVE_STALE_RECONCILE_SECS: "60"
      POLYMARKET_CLOB_BASE_URL: "https://clob.polymarket.com"
      POLYMARKET_DATA_API_BASE_URL: "https://data-api.polymarket.com"
      POLYMARKET_HEALTH_INTERVAL_SECS: "30"
      POLYMARKET_HTTP_ENABLED: "true"
      POLYMARKET_HTTP_BIND: "0.0.0.0:8097"
      POLYMARKET_BTC_MODEL_DIR: "/usr/local/share/polymarket-bot/models"
    ports:
      - "127.0.0.1:8097:8097"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  ingester-master:
    image: ${INGESTER_IMAGE:-192200846560.dkr.ecr.eu-west-1.amazonaws.com/capitonic/ingester:production}
    container_name: ingester-master
    hostname: ingester-master
    init: true
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging: *default-logging
    env_file:
      - *app-env-file
      - path: ./.env.market-data-ingester
        required: true
        format: raw
      - *postgres-master-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "pgbouncer"
      POSTGRES_PORT: "6432"
      POSTGRES_USER: "capitonic_ingester_master"
      POSTGRES_DB: "${INGESTER_MASTER_POSTGRES_ALIAS:-polymarket_ingester_master_tx}"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      MARKET_DATA_INGESTER_DB_POOL_CONNECTIONS: "1"
      MARKET_DATA_INGESTER_CONTROL_DB_POOL_CONNECTIONS: "1"
      INGESTER_MODE: "master"
      INGESTER_INSTANCE: "ingester-master"
      INGESTER_API_BIND: "0.0.0.0:8098"
    ports:
      - "127.0.0.1:8099:8098"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8098/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 60s
    restart: unless-stopped

  ingester-worker:
    image: ${INGESTER_IMAGE:-192200846560.dkr.ecr.eu-west-1.amazonaws.com/capitonic/ingester:production}
    init: true
    mem_limit: 1g
    cpus: "0.75"
    pids_limit: 256
    logging: *default-logging
    env_file:
      - *app-env-file
      - path: ./.env.market-data-ingester
        required: true
      - *postgres-worker-env-file
    environment:
      RUST_LOG: "info"
      POSTGRES_HOST: "pgbouncer"
      POSTGRES_PORT: "6432"
      POSTGRES_USER: "capitonic_ingester_worker"
      POSTGRES_DB: "${INGESTER_WORKER_POSTGRES_ALIAS:-polymarket_ingester_worker_tx}"
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_SSL_CA_FILE: ""
      MARKET_DATA_INGESTER_DB_POOL_CONNECTIONS: "1"
      MARKET_DATA_INGESTER_CONTROL_DB_POOL_CONNECTIONS: "1"
      INGESTER_MODE: "worker"
      INGESTER_GRPC_BIND: "0.0.0.0:50051"
      INGESTER_WORKER_METRICS_BIND: "0.0.0.0:8099"
      INGESTER_MASTER_URL: "http://ingester-master:8098"
      INGESTER_DEPLOYMENT_ID: "${INGESTER_DEPLOYMENT_ID:-production}"
      INGESTER_WORKER_MAX_BACKFILLS: "1"
      INGESTER_WORKER_CAPACITY_UNITS: "4"
      INGESTER_WORKER_REALTIME_SLOT_LIMIT: "1"
      INGESTER_IMAGE_DIGEST: "${INGESTER_IMAGE_DIGEST:?INGESTER_IMAGE_DIGEST is required}"
      INGESTER_GIT_REVISION: "${INGESTER_GIT_REVISION:?INGESTER_GIT_REVISION is required}"
      BINANCE_ARCHIVE_BASE_URL: "https://data.binance.vision"
      BINANCE_FUTURES_DATA_BASE_URL: "https://fapi.binance.com"
      CRYPTOHFT_BASE_URL: "https://api.cryptohftdata.com"
      COINAPI_API_ORIGIN: "https://api-ncsa.coinapi.io"
      INGESTER_BINANCE_CACHE_DIRECTORY: "/var/lib/binance-l2/binance-public"
      INGESTER_BINANCE_AGG_TRADE_LAKE_ROOT: "/var/lib/binance-aggregate-trades"
      INGESTER_POLYMARKET_ORDERBOOK_LAKE_ROOT: "/var/lib/polymarket-orderbooks"
      INGESTER_CRYPTOHFT_ARCHIVE_ROOT: "/var/lib/binance-l2"
      INGESTER_CRYPTOHFT_TEMPORARY_DIRECTORY: "/var/lib/binance-l2/tmp"
      INGESTER_COINAPI_ARCHIVE_ROOT: "/var/lib/binance-l2/coinapi"
      CHAINLINK_DATA_STREAMS_REST_URL: "https://api.dataengine.chain.link"
      CHAINLINK_CANDLESTICK_BASE_URL: "https://priceapi.dataengine.chain.link"
      POLYGON_RPC_URL: "${POLYMARKET_POLYGON_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"
      POLYGON_ARCHIVE_LOG_RPC_URL: "${POLYMARKET_POLYGON_ARCHIVE_LOG_RPC_URL:-https://tenderly.rpc.polygon.community}"
      PMDATA_BASE_URL: "https://api.pmdata.dev"
      PMDATA_API_KEY: "${PM_DATA_API_KEY:-}"
      INGESTER_PMDATA_ARCHIVE_ROOT: "/tmp/pmdata"
      KRAKEN_FUTURES_BASE_URL: "https://futures.kraken.com"
      KRAKEN_SPOT_BASE_URL: "https://api.kraken.com"
      INGESTER_KRAKEN_DATA_ROOT: "/var/lib/kraken-data"
      INGESTER_FINANCIAL_DATA_ROOT: "/var/lib/financial-data"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      INGESTER_WEATHER_RAW_ROOT: "/var/lib/weather/raw"
    volumes:
      - ${WEATHER_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/temperature-expectancy}:/var/lib/weather
      - ${BINANCE_L2_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/binance-l2}:/var/lib/binance-l2
      - ${BINANCE_AGG_TRADE_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/binance-aggregate-trades}:/var/lib/binance-aggregate-trades
      - ${POLYMARKET_ORDERBOOK_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/orderbook-drain}:/var/lib/polymarket-orderbooks
      - ${KRAKEN_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/kraken-data}:/var/lib/kraken-data
      - ${FINANCIAL_DATA_ROOT:-/Volumes/docker-data/polymarket-bot/global-financial-data}:/var/lib/financial-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8099/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      ingester-master:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: prometheus
    hostname: prometheus
    init: true
    mem_limit: 384m
    cpus: "0.20"
    pids_limit: 128
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/prometheus-provisioning-entrypoint.sh
    command:
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.listen-address=0.0.0.0:9090
    env_file:
      - *prometheus-env-file
    environment:
      PROMETHEUS_ENVIRONMENT: "production"
    volumes:
      - prometheus-data:/prometheus
      - ./common/configs/prometheus:/etc/prometheus-src:ro
      - ./common/scripts/prometheus-provisioning-entrypoint.sh:/usr/local/bin/prometheus-provisioning-entrypoint.sh:ro
      - ./common/scripts/prometheus-healthcheck.sh:/usr/local/bin/prometheus-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/prometheus-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: loki
    hostname: loki
    init: true
    mem_limit: 384m
    cpus: "0.20"
    pids_limit: 128
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ./common/configs/loki/loki.yml:/etc/loki/loki.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: alloy
    hostname: alloy
    init: true
    mem_limit: 128m
    cpus: "0.10"
    pids_limit: 128
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./common/configs/alloy/market-data-ingester.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    container_name: grafana
    hostname: grafana
    mem_limit: 256m
    cpus: "0.20"
    logging: *default-logging
    entrypoint:
      - /usr/local/bin/grafana-provisioning-entrypoint.sh
    env_file:
      - *grafana-env-file
      - *prometheus-env-file
      - *postgres-grafana-env-file
    environment:
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "browser"
      GRAFANA_POSTGRES_HOST: "pgbouncer"
      GRAFANA_POSTGRES_PORT: "6432"
      GRAFANA_POSTGRES_DATABASE: "${GRAFANA_POSTGRES_ALIAS:-polymarket_observe_tx}"
      GRAFANA_POSTGRES_USER: "capitonic_grafana"
      GRAFANA_POSTGRES_MAX_OPEN_CONNS: "2"
      GRAFANA_POSTGRES_MAX_IDLE_CONNS: "1"
      GRAFANA_ALERT_ENVIRONMENT: "production"
      GRAFANA_PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_LOKI_URL: "http://loki:3100"
      PROMETHEUS_ENVIRONMENT: "production"
      GF_UNIFIED_ALERTING_STATE_HISTORY_ENABLED: "true"
      GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND: "loki"
      GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL: "http://loki:3100"
      GF_FEATURE_TOGGLES_ENABLE: "alertingCentralAlertHistory"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./common/configs/grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./common/configs/grafana/dashboards:/etc/grafana/dashboards/polymarket-bot:ro
      - ./common/scripts/grafana-provisioning-entrypoint.sh:/usr/local/bin/grafana-provisioning-entrypoint.sh:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    hostname: node-exporter
    init: true
    mem_limit: 96m
    cpus: "0.10"
    pids_limit: 64
    logging: *default-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    read_only: true
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    hostname: cadvisor
    mem_limit: 256m
    cpus: "0.20"
    pids_limit: 128
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    hostname: caddy
    mem_limit: 128m
    cpus: "0.10"
    pids_limit: 64
    logging: *default-logging
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./common/configs/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      grafana:
        condition: service_started
    restart: unless-stopped

volumes:
  timescaledb-0-data:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  caddy-data:
  caddy-config:
