name: Deploy Production EC2

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: mx-central-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/ec2-compose
  APP_SECRET_NAME: capitonic/polymarket-bot/production

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.terraform_action }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-ec2-compose
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Load Cloudflare Terraform inputs
        run: scripts/load-cloudflare-terraform-env.sh

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Write backend config
        run: |
          cat > "$TF_DIR/backend.hcl" <<'EOF'
          bucket       = "capitonic-polybot-tfstate-192200846560-mxc1"
          key          = "production/ec2-compose/terraform.tfstate"
          region       = "mx-central-1"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Initialize Terraform
        run: terraform -chdir="$TF_DIR" init -backend-config=backend.hcl

      - name: Import existing Cloudflare DNS records
        if: github.event.inputs.terraform_action == 'apply'
        run: scripts/import-cloudflare-dns-records.sh

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform plan
        run: terraform -chdir="$TF_DIR" plan -no-color -lock-timeout=60s -input=false

      - name: Terraform apply
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false -lock-timeout=60s

      - name: Terraform outputs
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" output

      - name: Verify host bootstrap
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text
            )"
            if [ "$STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "${STATUS:-}" != "Online" ]; then
            echo "Instance $INSTANCE_ID did not become SSM Online." >&2
            exit 1
          fi

          PARAMS_JSON="$(mktemp)"
          cat > "$PARAMS_JSON" <<'JSON'
          {
            "commands": [
              "timeout 1800 cloud-init status --wait || cloud-init status --long",
              "systemctl is-active docker",
              "systemctl is-active xrdp",
              "awk 'BEGIN{section=\"\"} /^\\[/{section=$0} section==\"[Globals]\" && /^port=/{global=$0} section!=\"[Globals]\" && /^port=tcp:\\/\\/\\.:3389$/{bad=1} END{exit !(global==\"port=tcp://.:3389\" && !bad)}' /etc/xrdp/xrdp.ini",
              "ss -4 -ltnH 'sport = :3389' | awk '{print $4}' | grep -qx '127.0.0.1:3389'",
              "test -z \"$(ss -6 -ltnH 'sport = :3389')\"",
              "firefox --version",
              "systemctl is-active cloudflared",
              "for attempt in $(seq 1 60); do journalctl -u cloudflared -n 240 --no-pager | grep -q 'Registered tunnel connection' && exit 0; sleep 5; done; journalctl -u cloudflared -n 240 --no-pager; exit 1",
              "cd /opt/polymarket-bot && sudo docker compose -f docker-compose.production.yml ps"
            ]
          }
          JSON

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Verify Polymarket EC2 bootstrap" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Bootstrap verification failed with status $COMMAND_STATUS." >&2
            exit 1
          fi

      - name: Deploy and verify bot service
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          REMOTE_SCRIPT="$(mktemp)"
          cat > "$REMOTE_SCRIPT" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          APP_DIRECTORY="/opt/polymarket-bot"
          APP_SECRET_NAME="capitonic/polymarket-bot/production"
          AWS_REGION="mx-central-1"
          ADMIN_BASE_URL="http://127.0.0.1:8097"
          COMPOSE_FILE="docker-compose.production.yml"
          SECRET_PATH="/root/polymarket/secret.json"

          aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APP_SECRET_NAME" \
            --query SecretString \
            --output text > "$SECRET_PATH"
          chmod 0600 "$SECRET_PATH"

          if [ ! -f "$SECRET_PATH" ]; then
            echo "Missing host secret file at $SECRET_PATH." >&2
            exit 1
          fi

          ADMIN_TOKEN="$(jq -r '.POLYMARKET_HTTP_ADMIN_TOKEN // empty' "$SECRET_PATH")"
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing POLYMARKET_HTTP_ADMIN_TOKEN in $SECRET_PATH." >&2
            exit 1
          fi

          cd "$APP_DIRECTORY"
          jq -r '
            to_entries
            | map(select(.key | startswith("GITHUB_") | not))
            | map(select(.key | startswith("GHCR_") | not))
            | map(select(.key | startswith("CLOUDFLARE_") | not))
            | map(select(.key | startswith("CLOUDFLARED_") | not))
            | map(select(.key | startswith("COLOUDFLARED_") | not))
            | map(select(.key != "RDP_PASSWORD"))
            | map(select(.key != "SSH_AUTHORIZED_KEYS"))
            | .[]
            | "\(.key)=\(.value | tostring)"
          ' "$SECRET_PATH" > "$APP_DIRECTORY/.env"
          chmod 0600 "$APP_DIRECTORY/.env"
          docker compose -f "$COMPOSE_FILE" up -d --no-build polymarket-bot

          for attempt in $(seq 1 60); do
            if curl -fsS \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            sleep 5
          done

          if ! curl -fsS \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null; then
            echo "Bot health API did not become available." >&2
            exit 1
          fi
          SCRIPT

          SSM_COMMAND="$(mktemp)"
          {
            printf "bash -s <<'REMOTE_SCRIPT'\n"
            cat "$REMOTE_SCRIPT"
            printf "\nREMOTE_SCRIPT\n"
          } > "$SSM_COMMAND"

          PARAMS_JSON="$(mktemp)"
          jq -n --rawfile script "$SSM_COMMAND" '{commands: [$script]}' > "$PARAMS_JSON"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Deploy and verify Polymarket bot service" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Bot deployment verification failed with status $COMMAND_STATUS." >&2
            exit 1
          fi
