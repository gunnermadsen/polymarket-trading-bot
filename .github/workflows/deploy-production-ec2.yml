name: Deploy Production EC2

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: mx-central-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/ec2-compose

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.terraform_action }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-ec2-compose-${{ github.event.inputs.terraform_action }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Write backend config
        run: |
          cat > "$TF_DIR/backend.hcl" <<'EOF'
          bucket       = "capitonic-polybot-tfstate-192200846560-mxc1"
          key          = "production/ec2-compose/terraform.tfstate"
          region       = "mx-central-1"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Initialize Terraform
        run: terraform -chdir="$TF_DIR" init -backend-config=backend.hcl

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform plan
        run: terraform -chdir="$TF_DIR" plan -no-color -lock-timeout=60s -input=false

      - name: Terraform apply
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false -lock-timeout=60s

      - name: Terraform outputs
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" output

      - name: Verify host bootstrap
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text
            )"
            if [ "$STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "${STATUS:-}" != "Online" ]; then
            echo "Instance $INSTANCE_ID did not become SSM Online." >&2
            exit 1
          fi

          PARAMS_JSON="$(mktemp)"
          cat > "$PARAMS_JSON" <<'JSON'
          {
            "commands": [
              "timeout 1800 cloud-init status --wait || cloud-init status --long",
              "systemctl is-active docker",
              "systemctl is-active xrdp",
              "systemctl is-active cloudflared",
              "cd /opt/polymarket-bot && sudo docker compose ps"
            ]
          }
          JSON

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Verify Polymarket EC2 bootstrap" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Bootstrap verification failed with status $COMMAND_STATUS." >&2
            exit 1
          fi
