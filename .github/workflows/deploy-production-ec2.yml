name: Deploy Production EC2

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: mx-central-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/ec2-compose
  APP_SECRET_NAME: capitonic/polymarket-bot/production

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.terraform_action }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-ec2-compose
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Load Cloudflare Terraform inputs
        run: scripts/load-cloudflare-terraform-env.sh

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Write backend config
        run: |
          cat > "$TF_DIR/backend.hcl" <<'EOF'
          bucket       = "capitonic-polybot-tfstate-192200846560-mxc1"
          key          = "production/ec2-compose/terraform.tfstate"
          region       = "mx-central-1"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Initialize Terraform
        run: terraform -chdir="$TF_DIR" init -backend-config=backend.hcl

      - name: Import existing Cloudflare DNS records
        if: github.event.inputs.terraform_action == 'apply'
        run: scripts/import-cloudflare-dns-records.sh

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform plan
        run: terraform -chdir="$TF_DIR" plan -no-color -lock-timeout=60s -input=false

      - name: Terraform apply
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false -lock-timeout=60s

      - name: Terraform outputs
        if: github.event.inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_DIR" output

      - name: Verify host bootstrap
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text
            )"
            if [ "$STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "${STATUS:-}" != "Online" ]; then
            echo "Instance $INSTANCE_ID did not become SSM Online." >&2
            exit 1
          fi

          PARAMS_JSON="$(mktemp)"
          cat > "$PARAMS_JSON" <<'JSON'
          {
            "commands": [
              "timeout 1800 cloud-init status --wait || cloud-init status --long",
              "systemctl is-active docker",
              "systemctl is-active xrdp",
              "systemctl is-active cloudflared",
              "for attempt in $(seq 1 60); do journalctl -u cloudflared -n 240 --no-pager | grep -q 'Registered tunnel connection' && exit 0; sleep 5; done; journalctl -u cloudflared -n 240 --no-pager; exit 1",
              "cd /opt/polymarket-bot && sudo docker compose -f docker-compose.production.yml ps"
            ]
          }
          JSON

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Verify Polymarket EC2 bootstrap" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Bootstrap verification failed with status $COMMAND_STATUS." >&2
            exit 1
          fi

      - name: Bootstrap trading processes
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          REMOTE_SCRIPT="$(mktemp)"
          cat > "$REMOTE_SCRIPT" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          APP_DIRECTORY="/opt/polymarket-bot"
          APP_SECRET_NAME="capitonic/polymarket-bot/production"
          AWS_REGION="mx-central-1"
          ADMIN_BASE_URL="http://127.0.0.1:8097"
          BOOTSTRAP_SCRIPT="scripts/bootstrap-trading-processes.mjs"
          SECRET_PATH="/root/polymarket/secret.json"

          aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APP_SECRET_NAME" \
            --query SecretString \
            --output text > "$SECRET_PATH"
          chmod 0600 "$SECRET_PATH"

          if [ ! -f "$SECRET_PATH" ]; then
            echo "Missing host secret file at $SECRET_PATH." >&2
            exit 1
          fi

          ADMIN_TOKEN="$(jq -r '.POLYMARKET_HTTP_ADMIN_TOKEN // empty' "$SECRET_PATH")"
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing POLYMARKET_HTTP_ADMIN_TOKEN in $SECRET_PATH." >&2
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if curl -fsS "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            sleep 5
          done

          if ! curl -fsS "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null; then
            echo "Bot health API did not become available." >&2
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if curl -fsS \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              "$ADMIN_BASE_URL/admin/trading-processes?limit=100" >/tmp/polymarket-processes-before.json; then
              break
            fi
            sleep 5
          done

          if [ ! -s /tmp/polymarket-processes-before.json ]; then
            echo "Bot admin API did not become available." >&2
            exit 1
          fi

          cd "$APP_DIRECTORY"
          if [ ! -f "$BOOTSTRAP_SCRIPT" ]; then
            echo "Missing $BOOTSTRAP_SCRIPT in $APP_DIRECTORY." >&2
            exit 1
          fi

          TEMPLATE_SUMMARY="$(
            jq -s -c '
              {
                total: length,
                sim_enabled: (
                  map(select(.enabled == true and ((.config.execution.mode // .config.raw.execution.mode // "") == "sim")))
                  | length
                ),
                live_disabled: (
                  map(select(.enabled == false and ((.config.execution.mode // .config.raw.execution.mode // "") == "live")))
                  | length
                )
              }
            ' infra/processes/*.json
          )"

          echo "$TEMPLATE_SUMMARY"
          printf '%s' "$TEMPLATE_SUMMARY" \
            | jq -e '.total == 2 and .sim_enabled == 1 and .live_disabled == 1' >/dev/null

          export POLYMARKET_HTTP_BASE_URL="$ADMIN_BASE_URL"
          export POLYMARKET_ADMIN_BASE_URL="$ADMIN_BASE_URL"
          export POLYMARKET_ADMIN_API_BASE_URL="$ADMIN_BASE_URL"
          export POLYMARKET_HTTP_ADMIN_TOKEN="$ADMIN_TOKEN"
          export POLYMARKET_ADMIN_TOKEN="$ADMIN_TOKEN"
          export POLYMARKET_BOOTSTRAP_EXPECTED_PROCESS_COUNT="2"
          export POLYMARKET_BOOTSTRAP_PROCESS_COUNT="2"
          export POLYMARKET_BOOTSTRAP_SIM_ENABLED="true"
          export POLYMARKET_BOOTSTRAP_LIVE_ENABLED="false"

          node "$BOOTSTRAP_SCRIPT" --base-url "$ADMIN_BASE_URL" --token "$ADMIN_TOKEN"

          curl -fsS \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$ADMIN_BASE_URL/admin/trading-processes?limit=100" >/tmp/polymarket-processes-after.json

          BOOTSTRAP_SUMMARY="$(
            jq -c '
              [
                .processes[]
                | select(.metadata.source == "infra/processes")
              ] as $processes
              | {
                  total: ($processes | length),
                  sim_enabled: (
                    $processes
                    | map(select(.enabled == true and ((.config.execution.mode // .config.raw.execution.mode // "") == "sim")))
                    | length
                  ),
                  live_disabled: (
                    $processes
                    | map(select(.enabled == false and ((.config.execution.mode // .config.raw.execution.mode // "") == "live")))
                    | length
                  ),
                  processes: (
                    $processes
                    | map({
                        name,
                        enabled,
                        mode: (.config.execution.mode // .config.raw.execution.mode // null)
                      })
                  )
                }
            ' /tmp/polymarket-processes-after.json
          )"

          echo "$BOOTSTRAP_SUMMARY"
          printf '%s' "$BOOTSTRAP_SUMMARY" \
            | jq -e '.total == 2 and .sim_enabled == 1 and .live_disabled == 1' >/dev/null
          SCRIPT

          SSM_COMMAND="$(mktemp)"
          {
            printf "bash -s <<'REMOTE_SCRIPT'\n"
            cat "$REMOTE_SCRIPT"
            printf "\nREMOTE_SCRIPT\n"
          } > "$SSM_COMMAND"

          PARAMS_JSON="$(mktemp)"
          jq -n --rawfile script "$SSM_COMMAND" '{commands: [$script]}' > "$PARAMS_JSON"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Bootstrap Polymarket trading processes" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Trading process bootstrap failed with status $COMMAND_STATUS." >&2
            exit 1
          fi
