name: Production images

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: 192200846560.dkr.ecr.eu-west-1.amazonaws.com
  ECR_POLYMARKET_BOT_REPOSITORY: capitonic/polymarket-bot
  ECR_INGESTER_REPOSITORY: capitonic/ingester
  ECR_DB_MIGRATE_REPOSITORY: capitonic/db-migrate
  RUST_TOOLCHAIN: 1.92.0

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      polymarket_bot: ${{ steps.filter.outputs.polymarket_bot }}
      ingester: ${{ steps.filter.outputs.ingester }}
      db_migrate: ${{ steps.filter.outputs.db_migrate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect affected images
        id: filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "polymarket_bot=true" >> "$GITHUB_OUTPUT"
            echo "ingester=true" >> "$GITHUB_OUTPUT"
            echo "db_migrate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed() {
            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }

          echo "polymarket_bot=$(changed Cargo.toml Cargo.lock packages/polymarket-bot packages/btc-directional-model/runtime-models common/proto .github/workflows/CD.yml)" >> "$GITHUB_OUTPUT"
          echo "ingester=$(changed Cargo.toml Cargo.lock packages/market-data-ingester common/proto .github/workflows/CD.yml)" >> "$GITHUB_OUTPUT"
          echo "db_migrate=$(changed packages/db-migrate .github/workflows/CD.yml)" >> "$GITHUB_OUTPUT"

  lint:
    name: Format and lint workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-lint
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Run Clippy
        run: >-
          cargo +"$RUST_TOOLCHAIN" clippy
          --locked --workspace --all-targets --all-features

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        package:
          - polymarket-bot
          - market-data-ingester
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-test-${{ matrix.package }}
      - name: Run tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --package "${{ matrix.package }}" --all-targets --all-features

  publish-polymarket-bot:
    name: Build and push polymarket-bot
    needs: [changes, lint, test]
    if: needs.changes.outputs.polymarket_bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/polymarket-bot/Dockerfile.production
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            POLYMARKET_GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_POLYMARKET_BOT_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_POLYMARKET_BOT_REPOSITORY }}:production
          cache-from: type=gha,scope=polymarket-bot-production
          cache-to: type=gha,scope=polymarket-bot-production,mode=max

  publish-ingester:
    name: Build and push ingester
    needs: [changes, lint, test]
    if: needs.changes.outputs.ingester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/market-data-ingester/Dockerfile.production
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            INGESTER_GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_INGESTER_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_INGESTER_REPOSITORY }}:production
          cache-from: type=gha,scope=ingester-production
          cache-to: type=gha,scope=ingester-production,mode=max

  publish-db-migrate:
    name: Build and push db-migrate
    needs: [changes, lint, test]
    if: needs.changes.outputs.db_migrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db-migrate/Dockerfile.production
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: DB_MIGRATE_GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_DB_MIGRATE_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_DB_MIGRATE_REPOSITORY }}:production
          cache-from: type=gha,scope=db-migrate-production
          cache-to: type=gha,scope=db-migrate-production,mode=max
