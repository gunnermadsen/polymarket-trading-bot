name: Deploy Production Images

on:
  workflow_dispatch:
    inputs:
      polymarket_bot_image_revision:
        description: Git revision for the immutable polymarket-bot image
        required: true
        type: string
      ingester_image_revision:
        description: Git revision for the immutable ingester image
        required: true
        type: string
      db_migrate_image_revision:
        description: Git revision for the immutable db-migrate image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: 192200846560.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  deploy:
    name: Roll out immutable production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-image-deployment
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve immutable image references
        shell: bash
        env:
          POLYMARKET_BOT_IMAGE_REVISION: ${{ inputs.polymarket_bot_image_revision }}
          INGESTER_IMAGE_REVISION: ${{ inputs.ingester_image_revision }}
          DB_MIGRATE_IMAGE_REVISION: ${{ inputs.db_migrate_image_revision }}
        run: |
          set -euo pipefail
          set +x
          for revision in "$POLYMARKET_BOT_IMAGE_REVISION" "$INGESTER_IMAGE_REVISION" "$DB_MIGRATE_IMAGE_REVISION"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          resolve_digest() {
            aws ecr describe-images --repository-name "$1" --image-ids "imageTag=$2" \
              --query 'imageDetails[0].imageDigest' --output text
          }
          bot_digest="$(resolve_digest capitonic/polymarket-bot "$POLYMARKET_BOT_IMAGE_REVISION")"
          ingester_digest="$(resolve_digest capitonic/ingester "$INGESTER_IMAGE_REVISION")"
          migrate_digest="$(resolve_digest capitonic/db-migrate "$DB_MIGRATE_IMAGE_REVISION")"
          for digest in "$bot_digest" "$ingester_digest" "$migrate_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          {
            echo "BOT_IMAGE=$ECR_REGISTRY/capitonic/polymarket-bot@$bot_digest"
            echo "INGESTER_IMAGE=$ECR_REGISTRY/capitonic/ingester@$ingester_digest"
            echo "MIGRATE_IMAGE=$ECR_REGISTRY/capitonic/db-migrate@$migrate_digest"
            echo "POLYMARKET_BOT_IMAGE_REVISION=$POLYMARKET_BOT_IMAGE_REVISION"
            echo "INGESTER_IMAGE_REVISION=$INGESTER_IMAGE_REVISION"
            echo "DB_MIGRATE_IMAGE_REVISION=$DB_MIGRATE_IMAGE_REVISION"
          } >> "$GITHUB_ENV"

      - name: Deploy through SSM
        shell: bash
        run: |
          set -euo pipefail
          set +x
          instance_id="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ] || { echo "Expected exactly one running production stack instance." >&2; exit 1; }

          update_env_command="$(printf \
            "cd /opt/polymarket-bot; sed -i -e '/^[A-Z_]*_IMAGE=/d' -e '/^INGESTER_GIT_REVISION=/d' -e '/^INGESTER_IMAGE_DIGEST=/d' .env; printf 'POLYMARKET_BOT_IMAGE=%%s\\nINGESTER_IMAGE=%%s\\nDB_MIGRATE_IMAGE=%%s\\nINGESTER_IMAGE_DIGEST=%%s\\nINGESTER_GIT_REVISION=%%s\\n' %q %q %q %q %q >> .env" \
            "$BOT_IMAGE" "$INGESTER_IMAGE" "$MIGRATE_IMAGE" "${INGESTER_IMAGE#*@}" "$INGESTER_IMAGE_REVISION")"
          deployment_script="$(printf \
            'set -euo pipefail; %s; %s; %s; %s; %s; %s' \
            "$update_env_command" \
            '/usr/local/sbin/polymarket-ecr-login' \
            'cd /opt/polymarket-bot && docker compose -f docker-compose.production.yml pull polymarket-bot ingester-master ingester-worker db-migrate' \
            'cd /opt/polymarket-bot && docker compose -f docker-compose.production.yml up -d --no-build --scale ingester-worker=8 db-migrate pgbouncer ingester-master ingester-worker polymarket-bot' \
            'cd /opt/polymarket-bot && docker compose -f docker-compose.production.yml ps' \
            'curl -fsS http://127.0.0.1:8097/health')"
          printf -v bash_command '/bin/bash -lc %q' "$deployment_script"
          parameters="$(jq -n \
            --arg bash_command "$bash_command" \
            '{commands:[$bash_command]}')"
          command_id="$(aws ssm send-command --instance-ids "$instance_id" --document-name AWS-RunShellScript \
            --parameters "$parameters" --comment "Deploy immutable Capitonic production images" \
            --timeout-seconds 1500 --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id" || true
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json)"
          jq . <<< "$result"
          [ "$(jq -r .Status <<< "$result")" = "Success" ]

      - name: Publish deployment summary
        run: |
          echo "### Immutable image deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Polymarket bot revision: $POLYMARKET_BOT_IMAGE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ingester revision: $INGESTER_IMAGE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migration revision: $DB_MIGRATE_IMAGE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment transport: AWS Systems Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image publication was not performed by CD" >> "$GITHUB_STEP_SUMMARY"
