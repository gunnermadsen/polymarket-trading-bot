name: Production deployment

# Image publication belongs to CI. Add the production deployment job here
# after its runtime infrastructure has been provisioned.
on:
  workflow_dispatch:
    inputs:
      polymarket_bot_digest:
        description: Immutable polymarket-bot image digest (sha256:...)
        required: true
        type: string
      ingester_digest:
        description: Immutable ingester image digest (sha256:...)
        required: true
        type: string
      db_migrate_digest:
        description: Immutable db-migrate image digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deployment-not-configured:
    name: Deployment target not configured
    runs-on: ubuntu-latest
    steps:
      - name: Stop before deployment
        shell: bash
        run: |
          echo "Production deployment infrastructure is not configured."
          echo "CI publishes immutable images; no deployment was attempted."
          exit 1
