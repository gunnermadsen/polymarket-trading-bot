name: CI

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      polymarket_bot: ${{ steps.filter.outputs.polymarket_bot }}
      ingester: ${{ steps.filter.outputs.ingester }}
      db_migrate: ${{ steps.filter.outputs.db_migrate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect affected images
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "polymarket_bot=true" >> "$GITHUB_OUTPUT"
            echo "ingester=true" >> "$GITHUB_OUTPUT"
            echo "db_migrate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() {
            if git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- "$@"; then echo false; else echo true; fi
          }
          echo "polymarket_bot=$(changed Cargo.toml Cargo.lock packages/polymarket-bot packages/btc-directional-model/runtime-models common/proto .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"
          echo "ingester=$(changed Cargo.toml Cargo.lock packages/market-data-ingester common/proto .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"
          echo "db_migrate=$(changed packages/db-migrate .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --package polymarket-bot --all-targets

  market-data-ingester-tests:
    name: Market data ingester tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo registry and ingester build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check Rust formatting
        run: >-
          cargo +"$RUST_TOOLCHAIN" fmt
          --all
          --
          --check

      - name: Run Clippy
        run: >-
          cargo +"$RUST_TOOLCHAIN" clippy
          --locked
          --package market-data-ingester
          --all-targets
          --all-features
          --
          -D warnings
          -A clippy::too_many_arguments

      - name: Run market data ingester tests
        run: >-
          cargo +"$RUST_TOOLCHAIN" test
          --locked
          --package market-data-ingester
          --all-targets
          --all-features

      - name: Build market data ingester documentation
        run: >-
          cargo +"$RUST_TOOLCHAIN" doc
          --locked
          --package market-data-ingester
          --no-deps
          --all-features

  production-image-validation:
    name: Validate ${{ matrix.name }} production image
    needs: [changes, rust-tests, market-data-ingester-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polymarket-bot
            dockerfile: packages/polymarket-bot/Dockerfile.production
            revision_arg: POLYMARKET_GIT_REVISION
            cache_scope: polymarket-bot-production
            change_key: polymarket_bot
          - name: ingester
            dockerfile: packages/market-data-ingester/Dockerfile.production
            revision_arg: INGESTER_GIT_REVISION
            cache_scope: ingester-production
            change_key: ingester
          - name: db-migrate
            dockerfile: packages/db-migrate/Dockerfile.production
            revision_arg: DB_MIGRATE_GIT_REVISION
            cache_scope: db-migrate-production
            change_key: db_migrate
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production image without publishing
        if: needs.changes.outputs[matrix.change_key] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            ${{ matrix.revision_arg }}=${{ github.sha }}
          tags: capitonic/${{ matrix.name }}:development
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
