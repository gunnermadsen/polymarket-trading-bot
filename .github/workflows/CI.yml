name: Verify and Publish Images

on:
  push:
    branches:
      - development
      - master
      - production
  pull_request:
    branches:
      - development
      - master
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '192200846560.dkr.ecr.eu-west-1.amazonaws.com' }}

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      polymarket_bot: ${{ steps.filter.outputs.polymarket_bot }}
      ingester: ${{ steps.filter.outputs.ingester }}
      db_migrate: ${{ steps.filter.outputs.db_migrate }}
      outage_recovery: ${{ steps.filter.outputs.outage_recovery }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect affected images
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "polymarket_bot=true" >> "$GITHUB_OUTPUT"
            echo "ingester=true" >> "$GITHUB_OUTPUT"
            echo "db_migrate=true" >> "$GITHUB_OUTPUT"
            echo "outage_recovery=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() {
            if git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- "$@"; then echo false; else echo true; fi
          }
          echo "polymarket_bot=$(changed Cargo.toml Cargo.lock packages/polymarket-bot packages/btc-directional-model/runtime-models common/proto .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"
          echo "ingester=$(changed Cargo.toml Cargo.lock packages/market-data-ingester common/proto .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"
          echo "db_migrate=$(changed packages/db-migrate .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"
          echo "outage_recovery=$(changed Cargo.toml Cargo.lock packages/polymarket-bot packages/market-data-ingester packages/db-migrate common/proto common/configs/grafana/provisioning/alerting/rules-market-data-ingester.yml scripts/test-market-data-ingester-alerts.rb scripts/test-outage-recovery.sh .github/workflows/CI.yml)" >> "$GITHUB_OUTPUT"

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --package polymarket-bot --all-targets

  market-data-ingester-tests:
    name: Market data ingester tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo registry and ingester build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check Rust formatting
        run: >-
          cargo +"$RUST_TOOLCHAIN" fmt
          --all
          --
          --check

      - name: Run Clippy
        run: >-
          cargo +"$RUST_TOOLCHAIN" clippy
          --locked
          --package market-data-ingester
          --all-targets
          --all-features
          --
          -D warnings
          -A clippy::too_many_arguments

      - name: Run market data ingester tests
        run: >-
          cargo +"$RUST_TOOLCHAIN" test
          --locked
          --package market-data-ingester
          --all-targets
          --all-features

      - name: Build market data ingester documentation
        run: >-
          cargo +"$RUST_TOOLCHAIN" doc
          --locked
          --package market-data-ingester
          --no-deps
          --all-features

  outage-recovery-integration:
    name: Outage recovery integration
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        if: needs.changes.outputs.outage_recovery == 'true'
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Cargo registry and recovery-test build output
        if: needs.changes.outputs.outage_recovery == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: outage-recovery-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            outage-recovery-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Test Polymarket route recovery
        if: needs.changes.outputs.outage_recovery == 'true'
        run: >-
          cargo +"$RUST_TOOLCHAIN" test
          --locked
          --package polymarket-bot
          market_data_stream::tests::route_runtime_recovers_across_worker_identity_replacement_and_outage
          --
          --exact

      - name: Test recovery alert rules
        if: needs.changes.outputs.outage_recovery == 'true'
        run: ruby scripts/test-market-data-ingester-alerts.rb

      - name: Test ingester process recovery
        if: needs.changes.outputs.outage_recovery == 'true'
        run: ./scripts/test-outage-recovery.sh

      - name: No recovery-sensitive changes
        if: needs.changes.outputs.outage_recovery != 'true'
        run: echo "No ingester or Polymarket route recovery changes detected."

      - name: Upload recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: outage-recovery-diagnostics
          path: target/recovery-test/
          if-no-files-found: ignore
          retention-days: 14

  production-image-validation:
    name: ${{ github.ref == 'refs/heads/production' && 'Build and push' || 'Validate' }} ${{ matrix.name }} production image
    needs: [changes, rust-tests, market-data-ingester-tests, outage-recovery-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polymarket-bot
            dockerfile: packages/polymarket-bot/Dockerfile.production
            revision_arg: POLYMARKET_GIT_REVISION
            repository: capitonic/polymarket-bot
            cache_scope: polymarket-bot-production
            change_key: polymarket_bot
          - name: ingester
            dockerfile: packages/market-data-ingester/Dockerfile.production
            revision_arg: INGESTER_GIT_REVISION
            repository: capitonic/ingester
            cache_scope: ingester-production
            change_key: ingester
          - name: db-migrate
            dockerfile: packages/db-migrate/Dockerfile.production
            revision_arg: DB_MIGRATE_GIT_REVISION
            repository: capitonic/db-migrate
            cache_scope: db-migrate-production
            change_key: db_migrate
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/production' && needs.changes.outputs[matrix.change_key] == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/production' && needs.changes.outputs[matrix.change_key] == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build production image
        if: needs.changes.outputs[matrix.change_key] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/production' }}
          provenance: mode=max
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            ${{ matrix.revision_arg }}=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:production
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
