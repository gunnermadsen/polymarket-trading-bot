name: Deploy Management EC2

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  APP_SECRET_NAME: capitonic/polymarket-bot/production
  TF_DIR: infra/management-ec2
  TF_STATE_BUCKET: capitonic-polybot-tfstate-192200846560-euw1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-management-ec2
      cancel-in-progress: false

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Report OIDC trust claims
        run: |
          set -euo pipefail
          set +x
          token="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          case $((${#payload} % 4)) in 2) payload="${payload}==" ;; 3) payload="${payload}=" ;; esac
          printf '%s' "$payload" | base64 -d | jq '{sub,aud,repository,ref,job_workflow_ref}'
          unset token payload

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment identity and region
        run: |
          set -euo pipefail
          set +x
          test "$AWS_REGION" = "eu-west-1"
          aws sts get-caller-identity
          aws secretsmanager describe-secret --secret-id "$APP_SECRET_NAME" >/dev/null

      - name: Load masked Cloudflare inputs
        run: scripts/load-management-terraform-env.sh

      - name: Initialize Terraform
        run: |
          set -euo pipefail
          cat > "$TF_DIR/backend.hcl" <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "production/management-ec2/terraform.tfstate"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF
          terraform -chdir="$TF_DIR" init -backend-config=backend.hcl

      - name: Reconcile dedicated Cloudflare tunnel
        run: |
          set -euo pipefail
          set +x
          resource_address="cloudflare_zero_trust_tunnel_cloudflared.management"
          tunnel_name="capitonic-polymarket-bot-management-rdp"

          if terraform -chdir="$TF_DIR" state show "$resource_address" >/dev/null 2>&1; then
            exit 0
          fi

          find_tunnel() {
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_cloudflare_account_id/cfd_tunnel?is_deleted=false&per_page=100" \
              | jq -r --arg name "$tunnel_name" \
                '[.result[] | select(.name == $name)] | if length == 1 then .[0].id else empty end'
          }

          tunnel_id="$(find_tunnel)"
          if [ -z "$tunnel_id" ]; then
            request_body="$(jq -n --arg name "$tunnel_name" '{name:$name,config_src:"cloudflare"}')"
            curl --max-time 30 -sS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$request_body" \
              "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_cloudflare_account_id/cfd_tunnel" \
              >/dev/null || true

            for attempt in $(seq 1 60); do
              tunnel_id="$(find_tunnel)"
              [ -n "$tunnel_id" ] && break
              sleep 10
            done
          fi

          [ -n "$tunnel_id" ] || { echo "Dedicated Cloudflare tunnel did not become visible." >&2; exit 1; }
          terraform -chdir="$TF_DIR" import -input=false \
            "$resource_address" "$TF_VAR_cloudflare_account_id/$tunnel_id"

      - name: Validate management infrastructure
        run: |
          terraform -chdir="$TF_DIR" fmt -check -recursive
          terraform -chdir="$TF_DIR" validate
          terraform -chdir="$TF_DIR" plan -no-color -input=false -lock-timeout=60s -out=management.tfplan

      - name: Deploy management host
        run: terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=60s management.tfplan

      - name: Verify secure RDP host bootstrap
        run: |
          set -euo pipefail
          set +x
          instance_id="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          status=""
          for attempt in $(seq 1 90); do
            status="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$instance_id" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            [ "$status" = "Online" ] && break
            sleep 10
          done
          [ "$status" = "Online" ] || { echo "Management host did not become SSM Online." >&2; exit 1; }

          parameters="$(mktemp)"
          jq -n '{commands: [
            "timeout 1800 cloud-init status --wait",
            "systemctl is-active xrdp",
            "systemctl is-active cloudflared",
            "systemctl is-enabled ssh.service 2>/dev/null | grep -qx masked",
            "systemctl is-enabled ssh.socket 2>/dev/null | grep -qx masked",
            "ss -4 -ltnH sport = :3389 | awk '\''{print $4}'\'' | grep -qx 127.0.0.1:3389",
            "test -z \"$(ss -6 -ltnH sport = :3389)\"",
            "command -v google-chrome-stable",
            "google-chrome-stable --version",
            "! command -v firefox",
            "test $(stat -c %a /etc/cloudflared/token) = 600",
            "journalctl -u cloudflared --no-pager -n 300 | grep -q '\''Registered tunnel connection'\''"
          ]}' > "$parameters"

          command_id="$(aws ssm send-command --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript --parameters "file://$parameters" \
            --comment "Verify secure Capitonic management RDP host" --timeout-seconds 2100 \
            --query 'Command.CommandId' --output text)"

          command_status="Pending"
          for attempt in $(seq 1 210); do
            command_status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || true)"
            case "$command_status" in Success|Cancelled|TimedOut|Failed|Cancelling) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          [ "$command_status" = "Success" ]

          ingress_count="$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=capitonic-polymarket-bot-management-sg \
            --query 'length(SecurityGroups[0].IpPermissions)' --output text)"
          [ "$ingress_count" = "0" ]

      - name: Publish connection summary
        run: |
          echo "### Management host ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: eu-west-1 (Ireland)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: $(terraform -chdir="$TF_DIR" output -raw instance_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "- RDP: rdp.capitonic.com through Cloudflare Access" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct inbound ports: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desktop browser: Google Chrome" >> "$GITHUB_STEP_SUMMARY"
