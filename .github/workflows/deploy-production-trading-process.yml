name: Deploy Production Paper Trading Process

on:
  workflow_dispatch:
    inputs:
      process_definition:
        description: Checked-in process definition to deploy and start
        required: true
        type: choice
        options:
          - infra/processes/btc-5m-risk-extended-specialist-180-240-c85-20260911.json
          - infra/processes/btc-5m-specialist-distilled-fair-value-native-admission-20260823.json

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod

jobs:
  deploy-process:
    name: Deploy and verify selected paper process
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-trading-process
      cancel-in-progress: false
    steps:
      - name: Checkout selected deployment revision
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate selected process definition
        env:
          PROCESS_DEFINITION: ${{ inputs.process_definition }}
        run: |
          set -euo pipefail
          jq -e '
            .enabled == false and .status == "created" and
            .process_type == "btc_5m" and .process_scope == "realtime_paper" and
            .config.execution.mode == "paper" and .config.execution.live_capital == false and
            (.config.raw.btc_realtime_paper.strategy.decision_strategy.model_key | length) > 0 and
            ((.config.raw.btc_realtime_paper.risk_strategies // []) | length) <= 1
          ' "$PROCESS_DEFINITION" >/dev/null

      - name: Deploy, start, and verify live inference
        shell: bash
        env:
          PROCESS_DEFINITION: ${{ inputs.process_definition }}
        run: |
          set -euo pipefail
          set +x
          instance_id="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ] || { echo "Expected exactly one running production stack instance." >&2; exit 1; }

          remote_script="$(mktemp)"
          cat > "$remote_script" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          set +x
          app=/opt/polymarket-bot
          definition="$app/__PROCESS_DEFINITION__"
          secret=/root/polymarket/secret.json
          token="$(jq -r '.POLYMARKET_HTTP_ADMIN_TOKEN // empty' "$secret")"
          [ -n "$token" ]
          process_key="$(jq -r '.process_key' "$definition")"
          trade_model_key="$(jq -r '.config.raw.btc_realtime_paper.strategy.decision_strategy.model_key' "$definition")"
          risk_model_key="$(jq -r '.config.raw.btc_realtime_paper.risk_strategies[0].model_key // empty' "$definition")"
          request="$(jq 'del(.process_key)' "$definition")"

          response="$(curl -fsS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data "$request" "http://127.0.0.1:8097/admin/trading-processes/by-key/$process_key")"
          process_id="$(jq -r '.process.process_id' <<< "$response")"
          [[ "$process_id" =~ ^[0-9a-f-]{36}$ ]]
          curl -fsS -X POST -H "Authorization: Bearer $token" \
            "http://127.0.0.1:8097/admin/trading-processes/$process_id/start" >/dev/null

          for attempt in $(seq 1 180); do
            process="$(curl -fsS -H "Authorization: Bearer $token" \
              "http://127.0.0.1:8097/admin/trading-processes/$process_id")"
            metrics="$(curl -fsS http://127.0.0.1:8097/prometheus/metrics)"
            running="$(jq -r '.process.status == "running" and .process.enabled == true' <<< "$process")"
            trade_model="$(grep -c "polymarket_umr_model_info{.*process_id=\"$process_id\".*model_key=\"$trade_model_key\"" <<< "$metrics" || true)"
            risk_model=1
            risk_model_configured=false
            if [ -n "$risk_model_key" ]; then
              risk_model_configured=true
              risk_model="$(grep -c "polymarket_umr_risk_model_info{.*process_id=\"$process_id\".*model_key=\"$risk_model_key\"" <<< "$metrics" || true)"
            fi
            inference="$(awk -v id="$process_id" '$0 ~ "polymarket_umr_last_success_timestamp_seconds" && $0 ~ "process_id=\\\"" id "\\\"" && $NF > 0 {found=1} END {print found+0}' <<< "$metrics")"
            if [ "$running" = "true" ] && [ "$trade_model" -gt 0 ] && [ "$risk_model" -gt 0 ] && [ "$inference" -eq 1 ]; then
              jq -n --arg process_id "$process_id" --arg process_key "$process_key" \
                --argjson risk_model_configured "$risk_model_configured" \
                '{process_id:$process_id,process_key:$process_key,status:"running",trade_model_loaded:true,risk_model_configured:$risk_model_configured,risk_model_verified:true,live_inference_observed:true}'
              exit 0
            fi
            sleep 5
          done
          echo "Process did not produce complete model and live inference evidence within 15 minutes." >&2
          exit 1
          SCRIPT
          sed -i "s#__PROCESS_DEFINITION__#$PROCESS_DEFINITION#g" "$remote_script"
          encoded="$(base64 -w0 "$remote_script")"
          parameters="$(jq -n --arg encoded "$encoded" '{commands:["printf %s " + ($encoded|@sh) + " | base64 -d > /tmp/deploy-production-process.sh", "chmod 0700 /tmp/deploy-production-process.sh", "/tmp/deploy-production-process.sh"]}')"
          command_id="$(aws ssm send-command --instance-ids "$instance_id" --document-name AWS-RunShellScript \
            --parameters "$parameters" --comment "Deploy selected production paper trading process" \
            --timeout-seconds 1200 --query 'Command.CommandId' --output text)"
          status="Pending"
          for attempt in $(seq 1 240); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 5
          done
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json)"
          jq . <<< "$result"
          [ "$(jq -r .Status <<< "$result")" = "Success" ]

      - name: Publish process summary
        run: |
          echo "### Production paper process active" >> "$GITHUB_STEP_SUMMARY"
          echo "- Process definition: ${{ inputs.process_definition }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution: paper only; live capital disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trade model and any configured optional risk model identities verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live inference evidence observed" >> "$GITHUB_STEP_SUMMARY"
