name: Refresh Production Secrets

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Docker Compose service to recreate with refreshed secrets"
        required: true
        default: "polymarket-bot"
        type: choice
        options:
          - polymarket-bot
          - pgbouncer
          - db-migrate
          - ingester-master
          - ingester-worker
          - grafana
      recreate:
        description: "Force recreate the selected service"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  TF_IN_AUTOMATION: "true"
  TF_DIR: infra/ec2-compose
  APP_SECRET_NAME: capitonic/polymarket-bot/production

jobs:
  refresh:
    name: Refresh ${{ github.event.inputs.service }} secrets
    runs-on: ubuntu-latest
    concurrency:
      group: production-ec2-compose
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Write backend config
        run: |
          cat > "$TF_DIR/backend.hcl" <<'EOF'
          bucket       = "capitonic-polybot-tfstate-192200846560-euw1"
          key          = "production/ec2-compose/terraform.tfstate"
          region       = "eu-west-1"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Initialize Terraform
        run: terraform -chdir="$TF_DIR" init -backend-config=backend.hcl

      - name: Refresh service secrets
        env:
          SERVICE_NAME: ${{ github.event.inputs.service }}
          FORCE_RECREATE: ${{ github.event.inputs.recreate }}
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform -chdir="$TF_DIR" output -raw instance_id)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text
            )"
            if [ "$STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "${STATUS:-}" != "Online" ]; then
            echo "Instance $INSTANCE_ID did not become SSM Online." >&2
            exit 1
          fi

          REMOTE_SCRIPT="$(mktemp)"
          cat > "$REMOTE_SCRIPT" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          APP_DIRECTORY="/opt/polymarket-bot"
          APP_SECRET_NAME="capitonic/polymarket-bot/production"
          AWS_REGION="eu-west-1"
          ADMIN_BASE_URL="http://127.0.0.1:8097"
          COMPOSE_FILE="docker-compose.production.yml"
          SECRET_PATH="/root/polymarket/secret.json"
          ENV_PATH="$APP_DIRECTORY/.env"
          APP_ENV_PATH="$APP_DIRECTORY/.env.runtime"
          SERVICE_NAME="${SERVICE_NAME:?SERVICE_NAME is required}"
          FORCE_RECREATE="${FORCE_RECREATE:-true}"

          case "$SERVICE_NAME" in
            polymarket-bot|pgbouncer|db-migrate|ingester-master|ingester-worker|grafana)
              ;;
            *)
              echo "Unsupported service for secret refresh: $SERVICE_NAME" >&2
              exit 1
              ;;
          esac

          install -d -m 0700 /root/polymarket /root/polymarket/env-backups
          if [ -f "$ENV_PATH" ]; then
            cp "$ENV_PATH" "/root/polymarket/env-backups/.env.$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          if [ -f "$APP_ENV_PATH" ]; then
            cp "$APP_ENV_PATH" "/root/polymarket/env-backups/.env.runtime.$(date -u +%Y%m%dT%H%M%SZ)"
          fi

          aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APP_SECRET_NAME" \
            --query SecretString \
            --output text > "$SECRET_PATH.tmp"
          jq -e 'type == "object"' "$SECRET_PATH.tmp" >/dev/null
          mv "$SECRET_PATH.tmp" "$SECRET_PATH"
          chmod 0600 "$SECRET_PATH"

          ADMIN_TOKEN="$(jq -r '.POLYMARKET_HTTP_ADMIN_TOKEN // empty' "$SECRET_PATH")"
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing POLYMARKET_HTTP_ADMIN_TOKEN in $SECRET_PATH." >&2
            exit 1
          fi

          cd "$APP_DIRECTORY"
          deployment_environment="$(mktemp)"
          if [ -f "$ENV_PATH" ]; then
            grep -E '^(POLYMARKET_BOT_IMAGE|INGESTER_IMAGE|DB_MIGRATE_IMAGE|POLYMARKET_GIT_REVISION|INGESTER_GIT_REVISION)=' "$ENV_PATH" \
              > "$deployment_environment" || true
          fi
          [ "$(wc -l < "$deployment_environment")" -eq 5 ] || {
            echo "The immutable deployment identity is incomplete in $ENV_PATH." >&2
            exit 1
          }
          jq -r '
            to_entries
            | map(select(.key | startswith("GITHUB_") | not))
            | map(select(.key | startswith("GHCR_") | not))
            | map(select(.key | startswith("CLOUDFLARE_") | not))
            | map(select(.key | startswith("CLOUDFLARED_") | not))
            | map(select(.key | startswith("COLOUDFLARED_") | not))
            | map(select(.key | startswith("CAPITONIC_") | not))
            | map(select(.key != "POSTGRES_PASSWORD"))
            | map(select(.key != "RDP_PASSWORD"))
            | map(select(.key != "SSH_AUTHORIZED_KEYS"))
            | .[]
            | "\(.key)=\(.value | tostring)"
          ' "$SECRET_PATH" > "$APP_ENV_PATH.tmp"
          cat "$deployment_environment" > "$ENV_PATH.tmp"
          rm -f "$deployment_environment"
          install -m 0600 "$ENV_PATH.tmp" "$ENV_PATH"
          install -m 0600 "$APP_ENV_PATH.tmp" "$APP_ENV_PATH"
          rm -f "$ENV_PATH.tmp"
          rm -f "$APP_ENV_PATH.tmp"

          postgres_password="$(jq -r '.POSTGRES_PASSWORD // empty' "$SECRET_PATH")"
          trading_password="$(jq -r '.CAPITONIC_TRADING_POSTGRES_PASSWORD // empty' "$SECRET_PATH")"
          master_password="$(jq -r '.CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD // empty' "$SECRET_PATH")"
          worker_password="$(jq -r '.CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD // empty' "$SECRET_PATH")"
          grafana_password="$(jq -r '.CAPITONIC_GRAFANA_POSTGRES_PASSWORD // empty' "$SECRET_PATH")"
          if [ -z "$postgres_password" ] || [ -z "$trading_password" ] || [ -z "$master_password" ] || [ -z "$worker_password" ] || [ -z "$grafana_password" ]; then
            echo "Missing one or more PostgreSQL credentials in $SECRET_PATH." >&2
            exit 1
          fi

          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password" > .env.postgres
          {
            printf 'CAPITONIC_TRADING_POSTGRES_PASSWORD=%s\n' "$trading_password"
            printf 'CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD=%s\n' "$master_password"
            printf 'CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD=%s\n' "$worker_password"
            printf 'CAPITONIC_GRAFANA_POSTGRES_PASSWORD=%s\n' "$grafana_password"
          } > .env.postgres.roles
          cp .env.postgres.roles .env.postgres.pgbouncer
          printf 'POSTGRES_PASSWORD=%s\n' "$trading_password" > .env.postgres.polymarket-bot
          printf 'POSTGRES_PASSWORD=%s\n' "$master_password" > .env.postgres.ingester-master
          printf 'POSTGRES_PASSWORD=%s\n' "$worker_password" > .env.postgres.ingester-worker
          printf 'POSTGRES_PASSWORD=%s\n' "$grafana_password" > .env.postgres.grafana
          ingester_admin_token="$(jq -r '.MARKET_DATA_INGESTER_ADMIN_TOKEN // empty' "$SECRET_PATH")"
          [ -n "$ingester_admin_token" ] || {
            echo "Missing MARKET_DATA_INGESTER_ADMIN_TOKEN in $SECRET_PATH." >&2
            exit 1
          }
          printf 'MARKET_DATA_INGESTER_ADMIN_TOKEN=%s\n' "$ingester_admin_token" > .env.market-data-ingester
          admin_token="$(jq -r '.POLYMARKET_HTTP_ADMIN_TOKEN // empty' "$SECRET_PATH")"
          [ -n "$admin_token" ] || {
            echo "Missing POLYMARKET_HTTP_ADMIN_TOKEN in $SECRET_PATH." >&2
            exit 1
          }
          if grep -q '^POLYMARKET_HTTP_ADMIN_TOKEN=' .env.grafana; then
            sed -i "s|^POLYMARKET_HTTP_ADMIN_TOKEN=.*$|POLYMARKET_HTTP_ADMIN_TOKEN=$admin_token|" .env.grafana
          else
            printf 'POLYMARKET_HTTP_ADMIN_TOKEN=%s\n' "$admin_token" >> .env.grafana
          fi
          jq -r '
            ["PROMETHEUS_BASIC_AUTH_USER", "PROMETHEUS_BASIC_AUTH_PASSWORD", "PROMETHEUS_BASIC_AUTH_PASSWORD_HASH"][] as $key
            | "\($key)=\(.[$key] // \"\")"
          ' "$SECRET_PATH" > .env.prometheus.production
          [ "$(grep -Ec '^[A-Z_]+=[^[:space:]]+$' .env.prometheus.production)" -eq 3 ] || {
            echo "Missing one or more PROMETHEUS_BASIC_AUTH_* values in $SECRET_PATH." >&2
            exit 1
          }
          chmod 0600 .env.postgres .env.postgres.roles .env.postgres.pgbouncer \
            .env.postgres.polymarket-bot .env.postgres.ingester-master \
            .env.postgres.ingester-worker .env.postgres.grafana .env.prometheus.production \
            .env.market-data-ingester .env.grafana

          docker compose -f "$COMPOSE_FILE" config --quiet

          if [ "$FORCE_RECREATE" = "true" ]; then
            if [ "$SERVICE_NAME" = "ingester-worker" ]; then
              docker compose -f "$COMPOSE_FILE" up -d --no-build --force-recreate --no-deps --scale ingester-worker=6 "$SERVICE_NAME"
            else
              docker compose -f "$COMPOSE_FILE" up -d --no-build --force-recreate --no-deps "$SERVICE_NAME"
            fi
          else
            if [ "$SERVICE_NAME" = "ingester-worker" ]; then
              docker compose -f "$COMPOSE_FILE" up -d --no-build --no-deps --scale ingester-worker=6 "$SERVICE_NAME"
            else
              docker compose -f "$COMPOSE_FILE" up -d --no-build --no-deps "$SERVICE_NAME"
            fi
          fi

          docker compose -f "$COMPOSE_FILE" ps "$SERVICE_NAME"

          if [ "$SERVICE_NAME" = "polymarket-bot" ]; then
            for attempt in $(seq 1 60); do
              if curl -fsS \
                -H "Authorization: Bearer $ADMIN_TOKEN" \
                "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null; then
                break
              fi
              sleep 5
            done

            curl -fsS \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              "$ADMIN_BASE_URL/health" | jq -e '.status == "ok"' >/dev/null

            curl -fsS \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              "$ADMIN_BASE_URL/admin/trading-processes?limit=100" \
              | jq '{process_count: (.processes | length), processes: [.processes[] | {process_key, process_scope, enabled, status, mode: (.config.execution.mode // .config.raw.execution.mode // null)}]}'
          fi

          echo "Secret refresh completed for $SERVICE_NAME."
          SCRIPT

          SSM_COMMAND="$(mktemp)"
          {
            printf "export SERVICE_NAME=%q\n" "$SERVICE_NAME"
            printf "export FORCE_RECREATE=%q\n" "$FORCE_RECREATE"
            printf "bash -s <<'REMOTE_SCRIPT'\n"
            cat "$REMOTE_SCRIPT"
            printf "\nREMOTE_SCRIPT\n"
          } > "$SSM_COMMAND"

          PARAMS_JSON="$(mktemp)"
          jq -n --rawfile script "$SSM_COMMAND" '{commands: [$script]}' > "$PARAMS_JSON"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://$PARAMS_JSON" \
              --comment "Refresh Polymarket production service secrets" \
              --timeout-seconds 1800 \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=""
          for attempt in $(seq 1 180); do
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text
            )"

            case "$COMMAND_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Secret refresh failed with status $COMMAND_STATUS." >&2
            exit 1
          fi
