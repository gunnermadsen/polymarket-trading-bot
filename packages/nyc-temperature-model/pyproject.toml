[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "capitonic-nyc-temperature-model"
version = "0.1.0"
description = "Isolated data procurement and expectancy benchmark for NYC daily-high markets"
requires-python = ">=3.11,<3.14"
license = { text = "UNLICENSED" }
dependencies = [
  "cfgrib>=0.9.15,<0.10",
  "herbie-data>=2025.7,<2027",
  "h5netcdf>=1.5,<2",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<22",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "xarray>=2025.1,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
nyc-temperature-model = "nyc_temperature_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_temperature_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
