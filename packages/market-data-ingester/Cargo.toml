[package]
name = "market-data-ingester"
version = "0.1.0"
edition = "2021"
description = "Development market-data ingestion service for Capitonic"
license = "UNLICENSED"
publish = false

[[bin]]
name = "ingester"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "56.2"
arrow-schema = "56.2"
arrow-select = "56.2"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
chainlink-data-streams-report = "1.2.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
parquet = { version = "56.2", default-features = false, features = ["arrow", "snap", "zstd"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
prometheus-client = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "rust_decimal", "macros"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
