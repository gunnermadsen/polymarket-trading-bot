[package]
name = "polymarket-bot"
version = "0.1.0"
edition = "2021"
description = "Polymarket negative-risk arbitrage scanner and execution service"
license = "UNLICENSED"
publish = false
autobins = false

[[bin]]
name = "polymarket-bot"
path = "src/main.rs"

[[bin]]
name = "derive-clob-creds"
path = "src/bin/derive-clob-creds.rs"

[[bin]]
name = "fit-chainlink-reliability-calibration"
path = "src/bin/fit-chainlink-reliability-calibration.rs"

[dependencies]
anyhow = "1.0"
alloy-signer-local = "1.8"
arrow-array = "56.2"
arrow-schema = "56.2"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
chainlink-data-streams-report = "1.2.2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures-util = "0.3"
hmac = "0.12"
hex = "0.4"
libc = "0.2"
md-5 = "0.10"
parquet = { version = "56.2", default-features = false, features = ["arrow", "snap", "zstd"] }
polymarket_client_sdk_v2 = { version = "0.6.0-canary.1", features = ["clob", "ws", "heartbeats"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "rust_decimal", "macros"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["serde", "v4", "v5"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.10"
tonic-build = "0.12"
protoc-bin-vendored = "3"
