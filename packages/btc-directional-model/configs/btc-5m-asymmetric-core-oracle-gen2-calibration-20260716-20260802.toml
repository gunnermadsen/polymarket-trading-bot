vwap_quantity = 5.0
maximum_depth_participation = 0.25
execution_reserve_per_share = 0.01
minimum_edge_per_share = 0.03
minimum_share_price = 0.20
maximum_share_price = 0.30
maximum_cost_per_share = 0.35
minimum_entry_second = 1
maximum_entry_second = 55

[calibration]
minimum_price = 0.20
maximum_price = 0.30
sides = ["YES", "NO"]
minimum_markets_per_cell = 50
minimum_days_per_cell = 7
identity_l2 = 1.0
slope_minimum = 0.05
slope_maximum = 3.0
compression_slope_minimum = 0.50
compression_slope_maximum = 1.00
intercept_minimum = -2.0
