[benchmark]
profile = "mature_reversal_fixed_120_reversal_decision"
tuning_identity = "exact_120_reversal_decision"
core_config = "configs/btc-5m-directional-core-oracle-early-entry-20260321-20260729.toml"
core_config_sha256 = "ec5262959ec33d15047943c7242d4e05ad43665f40313e304975c6644127b294"
evaluation_is_independent = false
evaluation_note = "The exact half-open UTC interval [2026-03-21, 2026-07-29), representing March 21 through July 28 inclusive, is consumed chronological development evidence. Seven contiguous validation windows span June 9 through July 28. Hyperparameter tuning, global Platt calibration, policy selection, and validation use only exact 120-second decisions; estimator fitting retains eligible rows from the causal 120/125/130/135/140-second context. Every candidate uses the same 71 core mature-reversal features, 28-day recency, and market-equal weighting. Source completeness is validated before each estimator row is independently admitted only when its contemporaneous BTC path is directionally defined. Exact-120 decisions are never conditioned on path availability at later timestamps. Oracle and order-book fields are excluded. July 29 and later remain untouched forward evidence."

[split]
development_start = "2026-03-21T00:00:00Z"
development_end = "2026-07-14T00:00:00Z"
probability_calibration_start = "2026-07-14T00:00:00Z"
probability_calibration_end = "2026-07-21T00:00:00Z"
policy_selection_start = "2026-07-21T00:00:00Z"
policy_selection_end = "2026-07-29T00:00:00Z"
