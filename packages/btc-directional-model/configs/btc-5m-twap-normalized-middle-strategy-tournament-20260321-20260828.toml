[[candidates]]
name = "middle_specialist_refit"
kind = "base"
feature_groups = ["core", "candles", "oracle", "refprice"]
description = "RefPrice-first directional specialist refit on normalized TWAP60 supervision."

[[candidates]]
name = "middle_q5_admission"
kind = "base"
feature_groups = ["core", "candles", "oracle", "refprice", "binance_prints", "execution"]
description = "Rich directional model with payoff-aware admission learned separately from prediction."

[[candidates]]
name = "middle_agreement_ensemble"
kind = "agreement"
members = ["middle_specialist_refit", "middle_q5_admission"]
description = "Trades only when the normalized specialist and Q5-style bases agree."

[[candidates]]
name = "crossvenue_middle_specialist"
kind = "base"
feature_groups = ["core", "candles", "oracle", "refprice", "open_interest", "binance_prints", "kraken", "spot_l2", "execution"]
description = "Full cross-venue specialist using Binance, Kraken, Chainlink, futures positioning, and qualified spot L2."

[[candidates]]
name = "price_time_calibrated_middle_ensemble"
