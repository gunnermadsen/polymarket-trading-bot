[benchmark]
profile = "chainlink_oi_champion_feature_ablation"
source_schema_revision = "f1ff0094753967b91e6dca90e38ce29359af3f3b"
control_candidate = "frozen_boundary_alignment_champion"
evaluation_note = "The frozen boundary-alignment champion remains the control. Chainlink-full and Chainlink-full-plus-OI use identical strict common July rows; the long-history candle challenger tests sample depth without fabricating unavailable RefPrice or OI history. Economic confirmation uses qualified executable-book rows, while the July 21-29 directional stress interval never imputes known PMXT gaps."

[champion]
model_key = "btc-5m-directional-boundary-alignment-20260421-20260720-paper-v1"
model_sha256 = "c0778189865ca97a748a9f76cbe72d13268fd6e76db683ea727ad142b0576bc4"
manifest_sha256 = "f4c2a5fa95e856105d732b5e9578df72e16033c5b2b9ae33f81874b214f8a8f7"
feature_schema_sha256 = "d2cadbff9ae97e20d2cbeb562310e27af80279f9ecbdbec85221af82ef4b9eea"

[windows]
source_range_start = "2026-03-21T00:00:00Z"
