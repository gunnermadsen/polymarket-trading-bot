[benchmark]
profile = "mature_reversal_fixed_120_accuracy"
candidate = "histogram_mature_reversal_recency_28d"
core_config = "configs/btc-5m-directional-core-oracle-early-entry-20260321-20260729.toml"
core_config_sha256 = "ec5262959ec33d15047943c7242d4e05ad43665f40313e304975c6644127b294"
evaluation_is_independent = false
evaluation_note = "The exact half-open UTC interval [2026-03-21, 2026-07-29), representing March 21 through July 28 inclusive, is consumed chronological development evidence. The direct-outcome histogram candidate retains its predecessor's exact 120/125/130/135/140-second estimator-training context, but probability calibration, policy selection, validation, and runtime decisions use only the exact 120-second row. It uses the frozen 71-feature mature-reversal core contract, global Platt calibration, equal total weight per market, and 28-day estimator-only recency decay. Oracle and order-book fields are excluded from model inputs. Thresholds are selected empirically and causally from each preceding policy cohort for the primary 15% and secondary 10% coverage objectives, then evaluated on the following validation cohort. The final paper threshold is selected only from July 21 through July 28 after fitting through July 13 and calibrating July 14 through July 20. Accuracy, balanced accuracy, both direction recalls, Wilson confidence, calibration, hard-confident errors, and five-share and ten-share execution economics are reported. A forward cohort beginning only after artifact freeze remains required for independent qualification."

