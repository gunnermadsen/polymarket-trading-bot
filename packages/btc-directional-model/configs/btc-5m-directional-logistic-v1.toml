[data]
range_start = "2026-04-21T00:00:00Z"
range_end = "2026-05-21T00:00:00Z"
sample_interval_seconds = 5
min_seconds_after_open = 60
min_seconds_before_close = 60
strict_final_price_audit = false

[split]
train_fraction = 0.60
calibration_fraction = 0.20
test_fraction = 0.20

[model]
c_candidates = [0.01, 0.1, 1.0, 10.0]
confidence_min = 0.50
confidence_max = 0.90
confidence_step = 0.01
target_accuracy = 0.65
target_wilson_lower = 0.60
minimum_calibration_markets = 300
minimum_test_markets = 500
maximum_train_test_accuracy_gap = 0.05
random_seed = 20260726

[evaluation]
holdout_is_independent = false
holdout_note = "The May 15-20 holdout was consumed by the first provisional run; v2 reruns are exploratory until later four-table coverage is complete."

[paths]
source_data = "data/source"
feature_data = "data/btc-5m-directional-features-v2.parquet"
runs = "runs"
artifacts = "artifacts"
