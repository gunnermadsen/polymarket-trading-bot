[benchmark]
core_config = "configs/btc-5m-directional-core-early-entry-calibration-20260421-20260720.toml"
control_candidate = "histogram_enriched"
candidate_names = [
  "histogram_enriched",
  "histogram_path_persistence",
  "histogram_path_persistence_prewindow",
  "histogram_path_persistence_time_calibrated",
]
evaluation_is_independent = false
evaluation_note = "The exact April 21-July 20 range is consumed chronological development evidence. July 21-August 4 outcome labels and directional features remain untouched; any separately recorded label-blind compact-book quality audit is diagnostic only. No runtime model is exported or deployed."
quantity = 5.0
early_cutoff_second = 120

[calibration]
minimum_rows_per_band = 500
bands = [
  { name = "60-89", start_second = 60, end_second_exclusive = 90 },
  { name = "90-119", start_second = 90, end_second_exclusive = 120 },
  { name = "120-179", start_second = 120, end_second_exclusive = 180 },
  { name = "180-240", start_second = 180, end_second_exclusive = 241 },
]

[advancement_gates]
minimum_early_markets = 500
minimum_common_markets = 500
minimum_executable_markets = 500
minimum_coverage_uplift = 0.000000001
maximum_accuracy_regression = 0.0
maximum_balanced_accuracy_regression = 0.0
maximum_direction_recall_regression = 0.0
maximum_median_entry_seconds_regression = -5.0
minimum_mean_direct_edge_per_share = 0.0
minimum_realized_net_per_share = 0.0

[paths]
prewindow_features = "data/btc-prewindow-regime-20260421-20260720/features.parquet"
execution_evidence = "data/btc-execution-evidence-20260527-20260611"
runs = "runs/btc-path-persistence-20260421-20260720"
