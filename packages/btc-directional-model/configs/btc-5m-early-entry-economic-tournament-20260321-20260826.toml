[[candidates]]
name = "external_flow_only_control"
kind = "base"
feature_groups = ["core", "open_interest", "binance_prints", "kraken", "spot_l2", "kraken_l2"]
preferred_admission = "hybrid_vwap5"
description = "Settlement-feed-free control using Binance and Kraken path, flow, positioning, and L2 evidence."

[[candidates]]
