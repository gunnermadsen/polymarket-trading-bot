[training]
profile = "btc_5m_middle_market_ablation_tournament"
paper_only = true
live_capital_allowed = false
random_seed = 20260820

[windows]
fit_start = "2026-05-25T00:00:00Z"
fit_end = "2026-07-13T00:00:00Z"
calibration_end = "2026-07-20T00:00:00Z"
meta_end = "2026-07-27T00:00:00Z"
policy_end = "2026-08-10T00:00:00Z"
holdout_end = "2026-08-18T00:00:00Z"

[entry]
start_second = 90
end_second_exclusive = 180
cadence_seconds = 5
calibration_cells = [[90, 120], [120, 150], [150, 180]]

[execution]
quantities = [5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 125, 150, 175, 200]
freshness_seconds = 10
maximum_depth_participation = 0.25
execution_reserve_per_share = 0.005
stress_slippage_per_share = 0.01

[model]
learning_rate = 0.04
max_iter = 240
max_leaf_nodes = 31
min_samples_leaf = 140
l2_regularization = 4.0
calibration_c = 0.25
calibration_max_iter = 2000
local_calibration_minimum_rows = 50
local_calibration_shrinkage_rows = 200
oof_initial_fit_days = 14
oof_calibration_days = 7
oof_fold_days = 7
loss_max_iter = 180
loss_max_leaf_nodes = 15
loss_min_samples_leaf = 100
loss_l2_regularization = 5.0
wait_horizons_seconds = [5, 10, 15, 30]

[policy]
confidence_thresholds = [0.65, 0.70, 0.75, 0.80, 0.85]
stress_edge_thresholds = [0.00, 0.005, 0.01, 0.02, 0.03, 0.05]
loss_severity_thresholds = [0.05, 0.10, 0.20, 0.30, 0.50]
wait_advantage_thresholds = [-0.02, 0.00, 0.02]
coverage_targets = [0.10, 0.20, 0.35]
price_bucket_edges = [0.00, 0.65, 0.75, 0.85, 1.01]
rolling_fold_days = 3

[gates]
minimum_trades = 100
minimum_market_coverage = 0.10
minimum_accuracy = 0.80
minimum_wilson_lower = 0.75
minimum_profit_factor = 1.20
minimum_payoff_ratio = 0.3333333333
minimum_profitable_fold_ratio = 0.75
minimum_active_days = 8
maximum_daily_pnl_concentration = 0.35
minimum_direction_trades = 20
minimum_price_bucket_trades = 20
maximum_average_entry_second = 145.0
maximum_median_entry_second = 145.0
minimum_early_trade_ratio = 0.10
minimum_active_entry_cells = 2
maximum_drawdown_to_net_pnl = 2.0
bootstrap_resamples = 1000
bootstrap_confidence = 0.95

[readiness]
minimum_scheduled_market_coverage = 0.80
minimum_daily_market_coverage = 0.70
required_consecutive_days = 8
maximum_single_day_market_share = 0.25
minimum_optional_feature_coverage = 0.80

[paths]
source_tournament_config = "configs/btc-5m-middle-market-payoff-tournament-20260525-20260810.toml"
runs = "runs/btc-middle-market-ablation-tournament-20260525"
committed_results = "training-results/btc-5m-middle-market-ablation-tournament-20260525"

