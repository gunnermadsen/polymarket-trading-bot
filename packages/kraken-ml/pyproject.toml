[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "kraken-ml"
version = "0.1.0"
description = "Reproducible PF_XBTUSD classical-ML qualification benchmark"
requires-python = ">=3.11,<3.14"
license = { text = "UNLICENSED" }
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "polars>=1.20,<2",
  "pyarrow>=19,<22",
  "scikit-learn>=1.7,<2",
  "scipy>=1.14,<2",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
kraken-ml = "kraken_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kraken_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
